<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIOCODE · The Thermodynamic Code of Life</title>
  <style>
/* BIOCODE · hoja de estilos · tema "laboratorio futurista" (azul marino, cian, verde) */

:root {
  --bg0: #030a14;
  --bg1: #061426;
  --panel: rgba(10, 30, 54, 0.78);
  --panel-solid: #0a1e36;
  --line: rgba(80, 190, 255, 0.18);
  --line-strong: rgba(80, 190, 255, 0.38);
  --text: #d8ecff;
  --muted: #86a3bf;
  --bio: #4df0a8;
  --cpu: #4ea8ff;
  --amber: #ffb347;
  --red: #ff5a6a;
  --mono: Consolas, "SF Mono", Menlo, "Liberation Mono", monospace;
  --sans: "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(77, 240, 168, 0.10), transparent 60%),
    radial-gradient(1200px 600px at 90% -10%, rgba(78, 168, 255, 0.12), transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg0));
  min-height: 100%;
}
html { background: var(--bg0); }
button, input { font-family: inherit; }

.app { min-height: 100vh; display: flex; flex-direction: column; padding: 0 14px 8px; gap: 8px; }

/* ---------- Escenario ---------- */
.stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(380px, 0.85fr) minmax(0, 1.15fr); gap: 10px; align-items: stretch; min-height: 520px; }
.world, .center { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; backdrop-filter: blur(4px); }
.world--bio { box-shadow: inset 0 0 0 1px rgba(77, 240, 168, 0.06), 0 0 28px rgba(77, 240, 168, 0.05); }
.world--cpu { box-shadow: inset 0 0 0 1px rgba(78, 168, 255, 0.06), 0 0 28px rgba(78, 168, 255, 0.06); }

.world__head, .center__head { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.world__head h2, .center__head h2 { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.world__head small { font-size: 11px; letter-spacing: 0.04em; text-transform: none; color: var(--muted); font-weight: 400; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot--bio { background: var(--bio); box-shadow: 0 0 10px var(--bio); }
.dot--cpu { background: var(--cpu); box-shadow: 0 0 10px var(--cpu); }

.status { white-space: nowrap; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid; font-weight: 600; }
.status--ok   { color: #7dffc0; border-color: rgba(77, 240, 168, 0.5); background: rgba(77, 240, 168, 0.10); }
.status--info { color: #8fc8ff; border-color: rgba(78, 168, 255, 0.5); background: rgba(78, 168, 255, 0.10); }
.status--warn { color: #ffd08a; border-color: rgba(255, 179, 71, 0.6); background: rgba(255, 179, 71, 0.12); }
.status--bad  { color: #ff9aa5; border-color: rgba(255, 90, 106, 0.65); background: rgba(255, 90, 106, 0.14); }

.viewport { position: relative; flex: 1; min-height: 280px; }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- Indicadores centrales ---------- */
.center__cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; padding: 7px 12px 2px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; }
.c-bio { color: var(--bio); text-align: left; } .c-cpu { color: var(--cpu); text-align: right; }
.indicators { flex: 1; padding: 0 12px; display: flex; flex-direction: column; justify-content: space-between; }
.ind { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; padding: 3px 0 4px; border-bottom: 1px solid rgba(80, 190, 255, 0.09); }
.ind:last-child { border-bottom: 0; }
.ind__label { grid-column: 1 / -1; text-align: center; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 1px; }
.ind__side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ind__side--cpu { text-align: right; }
.ind__v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ind__side--bio .ind__v { color: var(--bio); } .ind__side--cpu .ind__v { color: var(--cpu); }
.ind__side small { font-size: 9.5px; color: var(--muted); line-height: 1.2; min-height: 11px; }
.bar { height: 3px; background: rgba(120, 180, 230, 0.16); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; transition: width 0.12s linear; }
.ind__side--bio .bar i { background: linear-gradient(90deg, #1fae78, var(--bio)); }
.ind__side--cpu .bar i { background: linear-gradient(90deg, #2d6fd0, var(--cpu)); margin-left: auto; }

/* ---------- Controles ---------- */
.controls { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(380px, 0.85fr) minmax(0, 1.15fr); gap: 10px; }
.ctl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 7px; }
.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
.ctl h3 { margin: 0; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; }
.ctl--bio h3 { color: var(--bio); } .ctl--cpu h3 { color: var(--cpu); } .ctl--sim h3 { color: var(--amber); }
.ctl--bio { border-top: 2px solid rgba(77, 240, 168, 0.55); }
.ctl--cpu { border-top: 2px solid rgba(78, 168, 255, 0.55); }
.ctl--sim { border-top: 2px solid rgba(255, 179, 71, 0.55); }
.ctl--bio input[type=range] { accent-color: var(--bio); } .ctl--cpu input[type=range] { accent-color: var(--cpu); }

.slider { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1px 10px; }
.slider span { grid-column: 1; grid-row: 1; font-size: 11.5px; color: #b4cde4; line-height: 1.2; }
.slider output { grid-column: 2; grid-row: 1; font-family: var(--mono); font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; grid-row: 2; width: 100%; margin: 2px 0 0; height: 16px; }

.row { display: flex; align-items: center; gap: 8px; }
.row--wrap { flex-wrap: wrap; }
.lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.check { white-space: nowrap; font-size: 12px; color: #b4cde4; display: flex; align-items: center; gap: 7px; cursor: pointer; }
.check input { accent-color: var(--amber); }

.btn { white-space: nowrap; padding: 6px 12px; font-size: 12.5px; color: var(--text); background: rgba(14, 40, 70, 0.85); border: 1px solid var(--line-strong); border-radius: 7px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
.btn:hover { background: rgba(30, 70, 115, 0.9); }
.btn:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--cpu); outline-offset: 2px; }
.btn--primary { background: linear-gradient(90deg, rgba(77, 240, 168, 0.28), rgba(78, 168, 255, 0.28)); font-weight: 600; min-width: 96px; }
.btn--ghost { background: transparent; }
.btn--seg { padding: 4px 10px; font-family: var(--mono); }
.btn--seg.is-active { background: rgba(255, 179, 71, 0.22); border-color: rgba(255, 179, 71, 0.7); color: #ffe0b0; }
.btn--preset { padding: 4px 9px; font-size: 11.5px; }

/* ---------- Pantallas más estrechas ---------- */
@media (max-width: 1180px) {
  .stage, .controls { grid-template-columns: 1fr 1fr; }
  .sliders { grid-template-columns: 1fr; }
  .center { grid-column: 1 / -1; order: 3; }
  .ctl--sim { grid-column: 1 / -1; order: 3; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* ==================== Módulos 1–10 y panel de ecuaciones ==================== */
body[data-view]:not([data-view="main"]) .app > .stage,
body[data-view]:not([data-view="main"]) .app > .controls { display: none; }
body[data-view="main"] #moduleHost { display: none; }
#moduleHost { display: flex; flex-direction: column; flex: 1; }

.mod { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.mod[hidden] { display: none; }
.mod__head { display: flex; align-items: center; gap: 12px; padding: 2px 2px 0; }
.mod__num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #04121f; background: linear-gradient(135deg, var(--bio), var(--cpu)); }
.mod__head h2 { margin: 0; font-size: 17px; letter-spacing: 0.04em; }
.mod__q { margin: 2px 0 0; font-size: 12.5px; color: #aac6e0; line-height: 1.4; }

.mod__grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(400px, 0.9fr) minmax(0, 1.1fr); gap: 10px; align-items: stretch; }
.mod__vp { flex: none; height: clamp(300px, 44vh, 470px); min-height: 0; }
.mod__mid { flex: none; min-height: 0; border-bottom: 1px solid var(--line); }
.mod__cap { margin: 0; padding: 5px 12px 7px; font-size: 11px; line-height: 1.4; color: var(--muted); border-top: 1px solid var(--line); min-height: 30px; }
.mod__center .mod__cap { border-top: 0; }
.mod__reads { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 6px; padding: 8px 12px 0; }
.mod__reads:empty { display: none; }
.rd { background: rgba(3, 10, 20, 0.55); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px 5px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.rd span { font-size: 9.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.rd b { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rd--bio b { color: var(--bio); } .rd--cpu b { color: var(--cpu); } .rd--heat b { color: var(--amber); } .rd--bad b { color: var(--red); }
.mod__eqwrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mod__eqs { padding: 10px 14px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px 22px; align-items: start; }
.eq { border-left: 2px solid var(--line-strong); padding: 1px 0 2px 9px; }
.eq__top { font-size: 11px; color: #cfe3f5; display: flex; align-items: center; gap: 2px; }
.eq__expr { font-family: var(--mono); font-size: 12.5px; color: #cfe6ff; line-height: 1.45; }
.eq__sub { font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 1.45; }

.mod .controls { grid-template-columns: minmax(0, 1.1fr) minmax(400px, 0.9fr) minmax(0, 1.1fr); }
.sliders--sim { grid-template-columns: 1fr 1fr; }
.sliders--sim:empty { display: none; }
.slider--wide { grid-column: 1 / -1; }
.slider--sel select, .mod select { grid-column: 1 / -1; grid-row: 2; width: 100%; padding: 4px 6px; font-size: 12px; color: var(--text); background: rgba(8, 25, 46, 0.95); border: 1px solid var(--line-strong); border-radius: 6px; }
.mod__btn { grid-column: 1 / -1; }
.mod__chk { grid-column: 1 / -1; }
.sliders .slider input[type=range] { min-width: 0; }


.mod__panel { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.mod__panel--wide { display: block; }

/* ==================================================================================
   SECUENCIA DE DIAPOSITIVAS · body[data-present]
   Cada pantalla: título, pregunta, célula | resultados | computadora, fórmulas,
   pocos controles e idea clave. Lo secundario se oculta.
   ================================================================================== */
#presHead, #presIdea, #presBar, #presFull, #presNotes, #presIndex, #presRefs { display: none; }
.pres-off { display: none !important; }

body[data-present] { overflow: hidden; height: 100vh; }
body[data-present] .app { height: 100vh; min-height: 0; padding: 12px 24px 10px; gap: 10px; overflow: hidden; }

/* orden vertical: cabecera · pantalla · idea clave · barra */
body[data-present] #presHead { display: flex; order: 0; align-items: center; gap: 16px; padding: 2px 2px 0; }
body[data-present] .stage, body[data-present] #moduleHost, body[data-present] #presFull { order: 1; }
body[data-present] .app > .controls { order: 2; }
body[data-present] #presIdea { display: flex; order: 8; }
body[data-present] #presBar { display: flex; order: 9; }
body[data-present][data-slide="cover"] #presHead, body[data-present][data-slide="cover"] #presIdea, body[data-present][data-slide="theory"] #presIdea { display: none; }
body[data-present][data-slide="cover"] .stage, body[data-present][data-slide="theory"] .stage,
body[data-present][data-slide="cover"] .app > .controls, body[data-present][data-slide="theory"] .app > .controls,
body[data-present][data-slide="cover"] #moduleHost, body[data-present][data-slide="theory"] #moduleHost { display: none !important; }
body[data-present][data-slide="cover"] #presFull, body[data-present][data-slide="theory"] #presFull { display: flex; flex: 1; min-height: 0; }

.ph__n { flex: none; min-width: 48px; height: 48px; padding: 0 6px; border-radius: 24px; display: grid; place-items: center; font-size: 21px; font-weight: 700; color: #04121f; background: linear-gradient(135deg, var(--bio), var(--cpu)); }
.ph__n:empty { display: none; }
.ph__t { margin: 0; font-size: 36px; line-height: 1.1; letter-spacing: 0.01em; font-weight: 700; }
.ph__q { margin: 0 0 0 auto; max-width: 44%; font-size: 19px; line-height: 1.35; color: #aac6e0; text-align: right; }

#presIdea { align-items: center; gap: 18px; padding: 12px 22px; border: 1px solid rgba(255, 179, 71, 0.35); border-left: 5px solid var(--amber); border-radius: 10px; background: linear-gradient(90deg, rgba(255, 179, 71, 0.13), rgba(255, 179, 71, 0.03)); }
.pi__k { flex: none; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; color: var(--amber); }
.pi__t { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 24px; line-height: 1.3; color: #f2f8ff; }
.pi__src { flex: none; max-width: 36%; padding-left: 16px; border-left: 1px solid rgba(255, 179, 71, 0.3); font-size: 14px; line-height: 1.3; color: var(--muted); text-align: right; }
.pi__src:empty { display: none; }

#presBar { align-items: center; gap: 10px; }
.pb__btn { min-width: 44px; }
.pb__count { min-width: 70px; text-align: center; font-family: var(--mono); font-size: 15px; color: var(--muted); }
.pb__dots { flex: 1; display: flex; gap: 4px; align-items: center; padding: 0 8px; }
.pb__dot { flex: 1; height: 9px; padding: 0; border: 0; border-radius: 5px; background: rgba(120, 180, 230, 0.22); cursor: pointer; }
.pb__dot:hover { background: rgba(120, 180, 230, 0.5); }
.pb__dot.is-seen { background: rgba(78, 168, 255, 0.55); }
.pb__dot.is-on { background: var(--bio); box-shadow: 0 0 10px var(--bio); }
#presBar .btn.is-active { background: rgba(255, 179, 71, 0.22); border-color: rgba(255, 179, 71, 0.7); }

/* ---------- actividad 2: simulador principal ---------- */
body[data-present][data-view="main"] #moduleHost { display: none; }
body[data-present] .stage { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 1fr); gap: 12px; }
body[data-present] .stage .world, body[data-present] .stage .center { min-height: 0; }
body[data-present] .stage .viewport { flex: 1 1 0; min-height: 0; }
body[data-present] .center__head h2 { font-size: 15px; }
body[data-present] .indicators { justify-content: space-evenly; padding: 0 16px 10px; }
body[data-present] .ind { border-bottom: 1px solid rgba(80, 190, 255, 0.14); padding-bottom: 14px; gap: 6px 14px; }
body[data-present] .ind__label { font-size: 17px; letter-spacing: 0.1em; color: #b4cde4; }
body[data-present] .ind__v { font-size: 40px; line-height: 1.1; }
body[data-present] .ind__side small { font-size: 16px; min-height: 18px; }
body[data-present] .bar { height: 10px; border-radius: 5px; }
body[data-present] .bar i { border-radius: 5px; }
body[data-present] .center__cols { font-size: 16px; padding-top: 10px; }

/* ---------- actividades 1 y 3 (módulos) ---------- */
body[data-present] #moduleHost { flex: 1; min-height: 0; display: flex; flex-direction: column; }
body[data-present] .mod { flex: 1; min-height: 0; gap: 10px; overflow: hidden; }
body[data-present] .mod__head { display: none; }
body[data-present] .mod__grid { flex: 1; min-height: 0; order: 1; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr) minmax(0, 1fr); gap: 12px; }
body[data-present] .mod__grid > section { min-height: 0; }
body[data-present] .mod__eqwrap { order: 2; }
body[data-present] .mod__ctl { order: 3; display: flex; gap: 12px; }
body[data-present] .mod__vp { flex: 1 1 0; height: auto; min-height: 0; }
body[data-present] .mod__mid { flex: 1 1 0; height: auto !important; min-height: 110px; }
body[data-present] .mod__cap { font-size: 14px; line-height: 1.35; min-height: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
body[data-present] .mod__center .center__head { display: none; }
body[data-present] .mod__reads { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px 14px; }
body[data-present] .rd { padding: 8px 12px 9px; gap: 3px; }
body[data-present] .rd span { font-size: 13px; letter-spacing: 0.04em; }
body[data-present] .rd b { font-size: 28px; }
body[data-present] .world__head h2 { font-size: 16px; }
body[data-present] .world__head small { font-size: 13px; }
body[data-present] .status { font-size: 14px; padding: 4px 12px; }

/* fórmulas del módulo, en grande */
body[data-present] .mod__eqs { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 10px 18px 12px; gap: 6px 30px; }
body[data-present] .eq { border-left-width: 4px; padding-left: 14px; }
body[data-present] .eq__top { font-size: 15px; font-weight: 600; color: var(--amber); }
body[data-present] .eq__expr { font-size: 30px; line-height: 1.3; overflow-wrap: anywhere; color: #f2f8ff; }
body[data-present] .eq__sub { font-size: 16px; overflow-wrap: anywhere; }

/* controles esenciales */
body[data-present] .mod__ctl .ctl, body[data-present] .app > .controls .ctl { padding: 9px 16px 12px; gap: 9px; }
body[data-present] .app > .controls { display: flex; gap: 12px; }
body[data-present][data-view]:not([data-view="main"]) .app > .controls { display: none; }
body[data-present] .ctl { flex: 1 1 0; min-width: 0; }
body[data-present] .ctl--sim { flex: 1.15 1 0; }
body[data-present] .ctl h3 { font-size: 12px; }
body[data-present] .slider span { font-size: 15px; }
body[data-present] .slider output { font-size: 15px; }
body[data-present] .slider input { height: 20px; }
body[data-present] .slider select, body[data-present] .mod select { font-size: 14px; padding: 5px 8px; }
body[data-present] .btn { font-size: 14px; padding: 7px 13px; }
body[data-present] .btn--preset { font-size: 13.5px; padding: 6px 11px; }
body[data-present] .lbl { font-size: 14px; }
body[data-present] .check { font-size: 14px; }

/* calculadora */
body[data-present] .mod__panel { flex: 1; min-height: 0; overflow: auto; }

/* ---------- portada ---------- */
.pf { width: 100%; margin: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; }
.pf--cover { gap: 18px; }
.pcv__top { display: flex; align-items: center; gap: 30px; }
.pf__logo { width: 124px; height: 124px; flex: none; }
.pcv__title { text-align: left; }
.pcv__title h1 { margin: 0; font-size: 104px; line-height: 1; letter-spacing: 0.34em; font-weight: 700;
  background: linear-gradient(90deg, var(--bio), var(--cpu)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pf__sub { margin: 10px 0 0; font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
.pf__q { margin: 0; max-width: 1200px; font-size: 27px; line-height: 1.4; color: #d8ecff; }
.pf__foot { margin: 4px 0 0; font-size: 17px; color: var(--muted); }

.pc { width: min(1560px, 100%); display: grid; grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1fr); gap: 12px 18px; align-items: stretch; text-align: left; }
.pc__h { display: flex; align-items: center; gap: 10px; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase; }
.pc__h--bio { color: var(--bio); } .pc__h--cpu { color: var(--cpu); }
.pc__k { display: flex; align-items: center; font-size: 25px; color: var(--amber); letter-spacing: 0.04em; }
.pc__c { display: flex; align-items: center; padding: 15px 22px; font-size: 27px; line-height: 1.25; color: #e6f2ff; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.pc__c--bio { border-top: 3px solid rgba(77, 240, 168, 0.6); } .pc__c--cpu { border-top: 3px solid rgba(78, 168, 255, 0.6); }

/* ---------- teoría: máximo 3 ideas y la fórmula protagonista ---------- */
.pf--theory { gap: 2.2vh; justify-content: center; height: 100%; margin: 0 auto; }
.pt { width: min(1640px, 100%); flex: 1 1 auto; max-height: calc(100vh - 240px); display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 28px; align-items: stretch; text-align: left; }
.pt__left { display: flex; flex-direction: column; justify-content: center; gap: 2vh; min-width: 0; }
.pt__ideas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2vh; flex: 1 1 auto; }

<script>
/**
 * BIOCODE · núcleo · namespace.js
 * ---------------------------------------------------------------------------
 * Crea el espacio de nombres global `BioCode` y un bus de eventos mínimo.
 * Todos los módulos se registran como propiedades de `BioCode` (sin ES modules)
 * para que la aplicación funcione abriendo index.html directamente (file://),
 * sin servidor y sin conexión a internet (importante en una exposición).
 *
 * El mismo código se carga en Node para ejecutar las pruebas de los modelos.
 */
(function (root) {
  'use strict';

  var BioCode = root.BioCode || (root.BioCode = {});
  BioCode.VERSION = '2.0.0 · exposición de 8 diapositivas';

  /** Bus de eventos (publicar/suscribir) que desacopla modelos, vistas y UI. */
  var handlers = Object.create(null);
  BioCode.Bus = {
    on: function (evt, fn) {
      (handlers[evt] || (handlers[evt] = [])).push(fn);
      return fn;
    },
    off: function (evt, fn) {
      var list = handlers[evt];
      if (!list) return;
      var i = list.indexOf(fn);
      if (i >= 0) list.splice(i, 1);
    },
    emit: function (evt, payload) {
      var list = handlers[evt];
      if (!list) return;
      for (var i = 0; i < list.length; i++) list[i](payload);
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/**
 * BIOCODE · núcleo · constants.js
 * ---------------------------------------------------------------------------
 * Constantes físicas (CODATA 2018, valores exactos del SI) y constantes
 * bioquímicas de referencia usadas por los modelos.
 *
 * Las constantes bioquímicas son valores de libro de texto. Cuando un valor
 * depende de las condiciones celulares (ΔG de la hidrólisis de ATP, ATP por
 * glucosa) se indica el rango y se fija un valor representativo.
 */
(function (root) {
  'use strict';
  var BC = root.BioCode;

  BC.Const = Object.freeze({
    // --- Física -------------------------------------------------------------
    R: 8.314462618,        // J/(mol·K)  constante de los gases
    kB: 1.380649e-23,      // J/K        constante de Boltzmann
    NA: 6.02214076e23,     // 1/mol      número de Avogadro
    K0: 273.15,            // K          0 °C
    SIGMA: 5.670374419e-8, // W/(m²·K⁴) constante de Stefan–Boltzmann

    // --- Bioquímica (valores representativos) ---------------------------------
    GLUCOSE_DH: 2803e3,        // J/mol  entalpía de combustión de la glucosa (|ΔH|)
    ATP_PER_GLUCOSE: 30,       // ATP/glucosa en oxidación completa (rango aceptado: ~28–32)
    ATP_DG: 50e3,              // J/mol  |ΔG| de hidrólisis de ATP en condiciones celulares
                               //        (estándar: 30,5 kJ/mol; en célula: ≈ 50–65 kJ/mol)
    ATP_PER_PEPTIDE_BOND: 4,   // equivalentes de ATP/GTP por enlace peptídico (mínimo)
    ATP_PER_BASE: 2,           // equivalentes de ATP por nucleótido añadido (replicación o transcripción; valor de libro de texto, sin corrección de errores)
    AA_ALPHABET: 20            // aminoácidos proteinogénicos
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>

(function (root) {

<script>
/**
 * BIOCODE · núcleo · engine.js
 * ---------------------------------------------------------------------------
 * Motor de simulación con paso de tiempo FIJO (dt = 0,02 s simulados).
 *   - Los modelos físicos avanzan en pasos fijos: el resultado no depende de
 *     los fotogramas por segundo del navegador.
 *   - La velocidad (×1, ×2, ×5, ×10) multiplica el tiempo simulado por segundo real.
 *   - Iniciar / pausar / reiniciar son operaciones del motor; las vistas solo
 *     escuchan eventos del bus:
 *       'frame'  { dtView, simTime, running, speed }   cada fotograma
 *       'sample' { t }                                  cada 0,5 s simulados
 *       'reset'  { }                                    tras reiniciar
 *   - dtView es el tiempo que las animaciones usan para moverse; se satura en
 *     ×3 para que a ×10 las partículas no se vuelvan ilegibles.
 */
(function (root) {
  'use strict';
  var BC = root.BioCode, Bus = BC.Bus;

  var DT = 0.02, MAX_STEPS = 200, SAMPLE = 0.5;
  var models = [];
  var running = false, speed = 1, simTime = 0, accum = 0, lastTs = null, sampleAcc = 0, started = false;

  function stepSim(n) {
    for (var k = 0; k < n; k++) {
      for (var j = 0; j < models.length; j++) models[j].step(DT);
      simTime += DT;
      sampleAcc += DT;
      if (sampleAcc >= SAMPLE - 1e-9) { sampleAcc -= SAMPLE; Bus.emit('sample', { t: simTime }); }
    }
  }

  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    var real = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    var dtView = 0;
    if (running) {
      accum += real * speed;
      var n = Math.min(MAX_STEPS, Math.floor(accum / DT));
      accum -= n * DT;
      if (n === MAX_STEPS) accum = 0;
      stepSim(n);
      dtView = real * Math.min(speed, 3);
    }
    Bus.emit('frame', { dtView: dtView, simTime: simTime, running: running, speed: speed, real: real });
    requestAnimationFrame(frame);
  }

  BC.Engine = {
    DT: DT,
    register: function (model) { models.push(model); },
    start: function () {
      running = true;
      if (!started) { started = true; requestAnimationFrame(frame); }
      Bus.emit('state', { running: running });
    },
    pause: function () { running = false; Bus.emit('state', { running: running }); },
    toggle: function () { running ? BC.Engine.pause() : BC.Engine.start(); },
    reset: function () {
      for (var i = 0; i < models.length; i++) models[i].reset();
      simTime = 0; accum = 0; sampleAcc = 0;
      Bus.emit('reset', {});
    },
    setSpeed: function (s) { speed = s; Bus.emit('state', { running: running, speed: speed }); },
    isRunning: function () { return running; },
    getSpeed: function () { return speed; },
    time: function () { return simTime; }
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/**
 * BIOCODE · modelos · cell-model.js        (MODELO ILUSTRATIVO, parámetros agrupados)
 * ---------------------------------------------------------------------------
 * Unidad celular representativa = 1 g de tejido metabólicamente activo (≈1 mL)
 * en un baño/medio a temperatura T_env. Un solo compartimento, sin espacio.
 *
 * VARIABLES DE ESTADO
 *   T    temperatura de la muestra [K]
 *   ATP  concentración de ATP [mM]      (reserva adenilato total A_tot = ADP + ATP)
 *
 * ENTRADAS (las mueve el usuario)
 *   Tenv      temperatura del medio [K]
 *   supply    disponibilidad de glucosa + O₂ (0–1)
 *   activity  demanda de trabajo celular: biosíntesis, transporte iónico… (0–1)
 *
 * ECUACIONES (todas implementadas en rates())
 *   f_N       = <f_N,i(T)>  población de 5 proteínas, dos estados, Gibbs–Helmholtz
 *   act(T)    = Q10^((T − 310,15)/10) · f_N²           (actividad enzimática relativa)
 *   prod      = Vp·supply·act · ADP/(K_adp + ADP)       [mM/s]  síntesis de ATP
 *             (con las entradas opcionales resp y coupling: ver rates(); por defecto no cambian nada)
 *   cons      = Vc·activity·act · ATP/(K_m + ATP)       [mM/s]  consumo de ATP
 *   dATP/dt   = prod − cons
 *   P_chem    = prod · (V·ΔH_glc / 30)                  [W]    energía química oxidada
 *   P_ATP     = prod · V·|ΔG_ATP|                       [W]    energía capturada en ATP
 *   W         = w · cons · V·|ΔG_ATP|                   [W]    trabajo neto almacenado
 *   Q_gen     = (P_chem − P_ATP) + (1 − w)·cons·V·|ΔG_ATP|
 *   Q_out     = G·(T − T_env)                           [W]    calor cedido al entorno
 *   C·dT/dt   = Q_gen − Q_out,   C = m·c
 *
 * BALANCE DE ENERGÍA (se verifica en tests/model-tests.js):
 *   P_chem = W + Q_out + C·dT/dt + d(E_ATP)/dt
 *
 * LÍMITES CONOCIDOS (se declaran en la interfaz):
 *   - Un solo compartimento; no hay difusión ni gradientes.
 *   - 30 ATP/glucosa fijo (no se modela la transición a glucólisis anaerobia).
 *   - Desplegamiento en equilibrio y reversible; en células reales la
 *     desnaturalización térmica suele ser irreversible (agregación).
 *   - Los valores de V_p, V_c, G y w son escalas ilustrativas elegidas para que
 *     las magnitudes sean del orden de las de un tejido real (≈10 mW/g).
 */
(function (root) {
  'use strict';
  var BC = root.BioCode, K = BC.Const, T = BC.Thermo, U = BC.Util;

  // Población ilustrativa de 5 proteínas: T_m de 42 a 60 °C (la mediana de las
  // proteínas humanas está en torno a 50–55 °C; las menos estables inician
  // el colapso funcional a ≈ 42–45 °C).
  var PROTEINS = [42, 47, 51, 55, 60].map(function (tm) {
    return { Tm: tm + K.K0, dHm: 500e3, dCp: 10e3 };
  });

  var PARAMS = Object.freeze({
    massG: 1.0,            // g
    volumeML: 1.0,         // mL
    cp: 3.6,               // J/(g·K)  calor específico del tejido (≈ 3,5–3,7)
    G: 0.15,               // W/K      conductancia térmica muestra → medio
    Atot: 5.0,             // mM       ATP + ADP
    Km: 0.5,               // mM       afinidad de los consumidores por ATP
    Kadp: 0.5,             // mM       afinidad de la fosforilación oxidativa por ADP
    VpMax: 0.45,           // mM/s     capacidad máxima de producción de ATP
    VcMax: 0.34,           // mM/s     capacidad máxima de consumo de ATP
    Q10: 2.2,
    Tref: 37 + K.K0,       // K
    workFrac: 0.10,        // fracción de la energía del ATP que queda como trabajo neto
    proteinShare: 0.25,    // fracción del ATP que se dedica a síntesis de proteínas
    proteins: PROTEINS
  });

  // Derivadas
  var Cth = PARAMS.massG * PARAMS.cp;                                                  // J/K
  var kGlc = 1e-6 * PARAMS.volumeML * K.GLUCOSE_DH / K.ATP_PER_GLUCOSE;                // W por (mM/s)
  var kAtp = 1e-6 * PARAMS.volumeML * K.ATP_DG;                                        // W por (mM/s)

  function create() {
    var m = {
      params: PARAMS,
      Cth: Cth,
      inputs: { Tenv: 37 + K.K0, supply: 1.0, activity: 0.5, resp: 1.0, coupling: 1.0 },
      state: { T: 37 + K.K0, ATP: 4.7, t: 0 },
      acc: null
    };

    /** Todas las tasas instantáneas a partir de (estado, entradas). */
    m.rates = function () {
      var s = this.state, i = this.inputs, p = PARAMS;
      var fN = T.foldedEnsemble(s.T, p.proteins);
      var act = T.q10(s.T, p.Tref, p.Q10) * fN * fN;
      var adp = Math.max(0, p.Atot - s.ATP);

      // resp (0–1): capacidad de la cadena respiratoria (p. ej. bloqueada por cianuro).
      // coupling (0–1): fracción de la respiración acoplada a la síntesis de ATP (un desacoplante la reduce:
      // la respiración deja de depender del ADP y más energía sale como calor). Con resp = coupling = 1
      // las ecuaciones son exactamente las originales.
      var resp = i.resp === undefined ? 1 : i.resp, cpl = i.coupling === undefined ? 1 : i.coupling;
      var respFlux, prod;
      if (cpl === 1) { respFlux = p.VpMax * i.supply * act * resp * adp / (p.Kadp + adp); prod = respFlux; }
      else {
        respFlux = p.VpMax * i.supply * act * resp * (cpl * adp / (p.Kadp + adp) + (1 - cpl));
        prod = cpl * respFlux;
      }
      var cons = p.VcMax * i.activity * act * s.ATP / (p.Km + s.ATP);

      var Pchem = respFlux * kGlc;
      var Patp = prod * kAtp;
      var W = p.workFrac * cons * kAtp;
      var Qgen = (Pchem - Patp) + (1 - p.workFrac) * cons * kAtp;
      var Qout = p.G * (s.T - i.Tenv);

      var bonds = p.proteinShare * cons * 1e-6 * p.volumeML * K.NA / K.ATP_PER_PEPTIDE_BOND;

      return {
        fN: fN, act: act, prod: prod, cons: cons, respFlux: respFlux,
        Pchem: Pchem, Patp: Patp, W: W, Qgen: Qgen, Qout: Qout,
        dT: (Qgen - Qout) / Cth,
        dATP: prod - cons,
        dEatp: (prod - cons) * kAtp,
        bonds: bonds                       // enlaces peptídicos / s (por g de tejido)
      };
    };

    /** Avanza dt segundos (Euler explícito; dt ≤ 0,05 s es estable aquí). */
    m.step = function (dt) {
      var r = this.rates(), s = this.state, a = this.acc;
      s.T += r.dT * dt;
      s.ATP = U.clamp(s.ATP + r.dATP * dt, 0, PARAMS.Atot);
      s.t += dt;
      a.Ein += r.Pchem * dt;
      a.W += r.W * dt;
      a.Qout += r.Qout * dt;
    };

    /** Salidas completas para vistas e indicadores. */
    m.outputs = function () {
      var r = this.rates(), s = this.state, i = this.inputs;
      var eAA = K.ATP_PER_PEPTIDE_BOND * K.ATP_DG / K.NA;          // J por aminoácido incorporado
      var bitsAA = Math.log(K.AA_ALPHABET) / Math.LN2;              // ≈ 4,32 bits por aminoácido
      return {
        Tk: s.T, Tc: T.kToC(s.T), TenvC: T.kToC(i.Tenv), ATP: s.ATP, Atot: PARAMS.Atot,
        fN: r.fN, act: r.act, prod: r.prod, cons: r.cons,
        Pchem: r.Pchem, W: r.W, Qout: r.Qout, Qgen: r.Qgen,
        bonds: r.bonds,
        eAA: eAA, bitsAA: bitsAA,
        landauer: T.landauer(s.T),
        eBitRatio: (eAA / bitsAA) / T.landauer(s.T),
        dSenv: T.entropyToSurroundings(r.Qout, i.Tenv),               // W/K
        status: m.status(r)
      };
    };

    m.status = function (r) {
      var s = this.state;
      r = r || this.rates();
      if (r.fN < 0.5) return { code: 'collapse', level: 'bad', label: 'Colapso funcional' };
      if (r.fN < 0.85) return { code: 'heat', level: 'warn', label: 'Estrés térmico' };
      if (s.ATP < 0.35 * PARAMS.Atot) return { code: 'energy', level: 'warn', label: 'Déficit de ATP' };
      if (r.act < 0.3) return { code: 'cold', level: 'info', label: 'Metabolismo lento' };
      return { code: 'ok', level: 'ok', label: 'Homeostasis' };
    };

    m.reset = function () {
      this.state.T = this.inputs.Tenv;     // equilibrio térmico inicial (ley cero)
      this.state.ATP = 4.7;
      this.state.t = 0;
      this.acc = { Ein: 0, W: 0, Qout: 0, T0: this.state.T, ATP0: this.state.ATP };
    };

    m.reset();
    return m;
  }

  BC.CellModel = { create: create, PARAMS: PARAMS, Cth: Cth, kGlc: kGlc, kAtp: kAtp };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/**
 * BIOCODE · modelos · cpu-model.js          (MODELO ILUSTRATIVO, parámetros agrupados)
 * ---------------------------------------------------------------------------
 * Procesador + disipador como un único nodo térmico con capacidad C_th,
 * refrigerado por aire hacia un ambiente a temperatura T_amb.
 *
 * VARIABLE DE ESTADO
 *   T      temperatura del conjunto [K]
 *
 * ENTRADAS
 *   Tamb   temperatura ambiente [K]
 *   supply disponibilidad de suministro eléctrico (0–1) → límite de potencia
 *   load   carga de trabajo / utilización u (0–1)
 *   fan    velocidad del ventilador (0–1)
 *
 * ECUACIONES (rates())
 *   f_obj  = f_min + (f_max − f_min)·min(1, u/0,8)        gobernador de frecuencia
 *   V(f)   = 0,70 + 0,125·f                               [V], f en GHz  (DVFS)
 *   P_dyn  = C_eff·u·f·V²                                  [W]   conmutación CMOS
 *   P_leak = P_leak0·V·exp((T_c − 60)/θ)                   [W]   fuga (crece con T)
 *   P_el   = P_base + P_leak + P_dyn                       [W]   potencia eléctrica
 *   R_th   = R_pas / (1 + g·fan)                           [K/W] resistencia térmica
 *   Q_out  = (T − T_amb)/R_th
 *   C·dT/dt = P_el − Q_out
 *
 * PROTECCIONES
 *   Térmica : f se reduce linealmente entre T_thr (90 °C) y T_crit (105 °C).
 *   Potencia: si P_el > P_nom·supply se baja f; si aun así no alcanza, se reduce
 *             el ciclo de trabajo. Con supply < 8 % la máquina no arranca.
 *   Apagado : T ≥ 110 °C apaga el equipo; vuelve a encender bajo 80 °C.
 *
 * BALANCE DE ENERGÍA: toda la energía eléctrica termina como calor,
 *   P_el = Q_out + C·dT/dt.
 * (El trabajo "útil" es información; la cota de Landauer, k_B·T·ln2 por bit
 * borrado, es varios órdenes de magnitud menor que la energía real por operación.)
 *
 * LÍMITES CONOCIDOS: un solo nodo térmico (sin gradientes en el die), IPC fijo,
 * sin modelo de núcleos individuales, parámetros del orden de un procesador de

    fanGain: 2.0,       // R_th = Rpass/(1 + fanGain·fan)  → 0,30 K/W a máxima velocidad
    Ceff: 16.5,         // nF efectivos (W por GHz·V²)
    fmin: 0.8, fmax: 4.5,   // GHz
    vA: 0.70, vB: 0.125,    // V(f) = vA + vB·f
    Pbase: 3.0,         // W   (uncore, relojes, reposo)
    Pleak0: 8.0,        // W   fuga a 1,0 V y 60 °C
    thetaLeak: 30,      // K
    Tthr: 90, Tcrit: 105, Tshut: 110, Tresume: 80,   // °C
    IPC: 3.0,
    Pnom: 165           // W   límite de potencia nominal (por encima de la potencia a plena carga)

        Pel: r.Pel, Pdyn: r.Pdyn, Pleak: r.Pleak, Qout: r.Qout,

      r = r || this.rates();

      if (!r.powered) return { code: 'nopower', level: 'bad', label: 'Sin suministro' };
      if (r.guard.indexOf('thermal') >= 0) return { code: 'throttle', level: 'warn', label: 'Throttling térmico' };

    };

      this.state.T = this.inputs.Tamb;     // equilibrio térmico inicial con el ambiente
      this.state.shutdown = false;
      this.state.t = 0;

<script>
/**
 * BIOCODE · módulos · draw.js
 * ---------------------------------------------------------------------------
 * Utilidades de dibujo 2D compartidas por los módulos: texto, rectángulos redondeados,
 * flechas, barras y formatos de potencia y energía. Solo dibujan; no calculan física.
 */
(function (root) {
  'use strict';
  var BC = root.BioCode, U = BC.Util;
  var FONT = '"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

  var Draw = {
    FONT: FONT,
    COL: { bio: '#4df0a8', cpu: '#4ea8ff', heat: '#ffb347', violet: '#c58bff', red: '#ff5a6a', text: '#d8ecff', muted: '#86a3bf', grid: 'rgba(120,180,230,0.14)' },

    text: function (g, s, x, y, o) {

      g.textBaseline = o.base || 'middle';

    rrect: function (g, x, y, w, h, r) {

      g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
      g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);

      g.strokeStyle = color; g.fillStyle = color; g.lineWidth = width; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1 - Math.cos(a) * head * 0.6, y1 - Math.sin(a) * head * 0.6); g.stroke();

      g.lineTo(x1 - head * Math.cos(a - 0.45), y1 - head * Math.sin(a - 0.45));

<script>
/**
 * BIOCODE · vistas · cell-view.js
 * ---------------------------------------------------------------------------
 * Célula pseudo-3D sobre canvas 2D: proyección en perspectiva de una escena
 * 3D que rota lentamente. Cada elemento visual se gobierna por una salida del
 * modelo (cell-model.js); la vista NO calcula física, solo la representa:
 *
 *   producción de ATP  → brillo de las mitocondrias y emisión de partículas de ATP
 *   consumo de ATP     → ATP que viaja a los ribosomas y se "gasta"
 *   enlaces peptídicos → piezas LEGO que salen de los ribosomas
 *   f_N (proteína nativa) → fracción de piezas que salen grises y torcidas
 *   T (temperatura)    → agitación térmica (∝ √T) y color de la membrana
 *   Q_out (calor)      → ondas de calor que se expanden desde la membrana
 *

 * el azar de esta vista es solo visual y no interviene en ningún resultado.
 */
(function (root) {
  'use strict';
  var BC = root.BioCode, U = BC.Util;

  var BRICK_COLORS = ['#ff5252', '#ffb300', '#43d17a', '#3aa0ff', '#b46bff', '#ff7ac8', '#2fd6d0', '#f4e04d'];
  var BASE_COLORS = { A: '#ff6b6b', T: '#ffd24d', G: '#4dd2ff', C: '#7dff9b' };

  function CellView(canvas, model) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.model = model;
    this.size = { w: 400, h: 340, dpr: 1 };
    this.rand = U.rng(20261109);
    this.yaw = 0.7;
    this.tilt = 0.30;
    this.phase = 0;
    this.out = model.outputs();
    this.atpAcc = 0; this.brickAcc = 0; this.heatAcc = 0;

    var r = this.rand, self = this;

    // Núcleo y mitocondrias (coordenadas en la esfera unidad)
    this.nucleus = { x: -0.18, y: 0.06, z: 0.0, r: 0.33 };
    this.mitos = [
      { x: 0.50, y: -0.30, z: 0.25, dx: 0.8, dy: 0.3, dz: -0.2, len: 0.24 },
      { x: 0.42, y: 0.42, z: -0.30, dx: -0.5, dy: 0.6, dz: 0.6, len: 0.22 },
      { x: -0.50, y: -0.45, z: -0.20, dx: 0.7, dy: -0.4, dz: 0.5, len: 0.21 },
      { x: 0.05, y: 0.62, z: 0.30, dx: 1.0, dy: 0.1, dz: 0.3, len: 0.20 }
    ];
    this.mitos.forEach(function (m) {
      var n = Math.sqrt(m.dx * m.dx + m.dy * m.dy + m.dz * m.dz);
      m.dx /= n; m.dy /= n; m.dz /= n;

    this.ribos = [];

      var p = this._randomInside(0.82);
      this.ribos.push({ x: p[0], y: p[1], z: p[2], vx: 0, vy: 0, vz: 0, type: 'ribo' });

  CellView.prototype._randomInside = function (R) {
    var r = this.rand, x, y, z;
    do { x = r() * 2 - 1; y = r() * 2 - 1; z = r() * 2 - 1; } while (x * x + y * y + z * z > 1);

  CellView.prototype._ensureOutsideNucleus = function (list) {
    var n = this.nucleus;
    list.forEach(function (p) {
      var dx = p.x - n.x, dy = p.y - n.y, dz = p.z - n.z, d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d < n.r + 0.05) {

  CellView.prototype.resize = function () {
    this.size = U.fitCanvas(this.canvas);

  CellView.prototype.reset = function () {

  };

  CellView.prototype._drawMito = function (ctx, m, glow) {

    var b = this._proj(m.x - m.dx * L, m.y - m.dy * L, m.z - m.dz * L);

    g.addColorStop(0, 'rgba(255,' + Math.round(170 + 60 * gl) + ',' + Math.round(80 + 60 * gl) + ',1)');
    g.addColorStop(1, 'rgba(200,' + Math.round(70 + 30 * gl) + ',50,0.95)');

      halo.addColorStop(0, 'rgba(255,220,90,' + (0.35 * gl) + ')');
      halo.addColorStop(1, 'rgba(255,220,90,0)');

  CellView.prototype._drawNucleus = function (ctx) {

      var rg = rungs[k], mid = { x: (rg.pa.x + rg.pb.x) / 2, y: (rg.pa.y + rg.pb.y) / 2 };

      ctx.strokeStyle = cB; ctx.beginPath(); ctx.moveTo(mid.x, mid.y); ctx.lineTo(rg.pb.x, rg.pb.y); ctx.stroke();

  CellView.prototype._drawBrick = function (ctx, br) {
    var p = this._proj(br.x, br.y, br.z);
    var w = 11 * p.s, h = 7.5 * p.s;

  CellView.prototype.draw = function () {

    var Rpx = this.R;

    // Fondo: citoplasma

    bg.addColorStop(1, 'rgba(8,36,60,0.92)');

    ctx.fillStyle = U.thermal(tNorm, 0.10);

    // Ondas de calor (detrás de todo, por fuera de la membrana)
    for (var h = 0; h < this.rings.length; h++) {
      var rg = this.rings[h], u = rg.age / 2.4;

    var pn = this._proj(this.nucleus.x, this.nucleus.y, this.nucleus.z); items.push({ z: pn.z, t: 'n' });

      var it = items[i];

        ctx.beginPath(); ctx.arc(it.p.x, it.p.y, 2.7 * it.p.s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(140,190,240,0.9)';
        ctx.beginPath(); ctx.arc(it.p.x + 2.2 * it.p.s, it.p.y - 1.6 * it.p.s, 1.7 * it.p.s, 0, Math.PI * 2); ctx.fill();
      } else if (it.t === 'a') {
        var gg = ctx.createRadialGradient(it.p.x, it.p.y, 0, it.p.x, it.p.y, 6 * it.p.s);
        gg.addColorStop(0, 'rgba(255,240,120,1)');
        gg.addColorStop(0.35, 'rgba(255,214,60,0.95)');
        gg.addColorStop(1, 'rgba(255,200,40,0)');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(it.p.x, it.p.y, 6 * it.p.s, 0, Math.PI * 2); ctx.fill();

    // Membrana: aro con color térmico y brillo especular
    ctx.lineWidth = 4;
    ctx.strokeStyle = U.thermal(tNorm, 0.95);
    ctx.beginPath(); ctx.arc(this.cx, this.cy, Rpx, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.arc(this.cx, this.cy, Rpx - 4, 0, Math.PI * 2); ctx.stroke();
    var hl = ctx.createLinearGradient(this.cx - Rpx, this.cy - Rpx, this.cx, this.cy);

    ctx.beginPath(); ctx.arc(this.cx, this.cy, Rpx - 2, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();

    var items2 = [['#8d86ff', 'ADN'], ['#ffb347', 'Mitocondria'], ['#bfe1ff', 'Ribosoma'], ['#ffd63c', 'ATP'], ['#43d17a', 'Proteína (LEGO)']];
    ctx.font = '11px "Segoe UI", system-ui, sans-serif';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var x = 10, y = sz.h - 14;
    for (var k = 0; k < items2.length; k++) {
      ctx.fillStyle = items2[k][0];
      ctx.beginPath(); ctx.arc(x + 4, y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(200,225,245,0.9)';
      ctx.fillText(items2[k][1], x + 12, y);
      x += 22 + ctx.measureText(items2[k][1]).width;

    }
  };

<script>
/**
 * BIOCODE · vistas · cpu-view.js
 * ---------------------------------------------------------------------------
 * Computadora dibujada en vista cenital sobre canvas 2D. Igual que la vista
 * celular, solo representa las salidas de cpu-model.js:
 *
 *   utilización u y f → parpadeo de los 16 núcleos y velocidad del "programa"
 *   P_el (potencia)   → pulsos que viajan por las pistas del circuito
 *   T (temperatura)   → color de núcleos, aletas del disipador y resplandor
 *   ventilador        → giro de las aspas y flujo de aire que se calienta al
 *                       cruzar el procesador (convección forzada)
 *   throttling        → aviso rojo sobre el encapsulado
 *
 * El programa que se desplaza es una analogía del dogma central
 * (ADN → ARN → proteína) escrita como código.
 */
(function (root) {
  'use strict';
  var BC = root.BioCode, U = BC.Util;

  var CODE = [
    '# BIOCODE · el dogma central escrito como programa',
    'TABLA = {"AUG": "Met", "GCC": "Ala", "AAG": "Lys",',
    '         "UUC": "Phe", "GGA": "Gly", "UCC": "Ser"}',
    '',
    'adn = "ATGGCCAAGTTCGGATCC"      # información almacenada',
    '',
    'def replicar(adn):',
    '    return adn[:]               # duplicar la información',
    '',
    'def transcribir(adn):',
    '    return adn.replace("T", "U")  # T -> U : ARN mensajero',
    '',
    'def traducir(arn):',
    '    proteina = []',
    '    for i in range(0, len(arn), 3):',
    '        codon = arn[i:i + 3]',
    '        proteina.append(TABLA[codon])  # codón -> aminoácido',
    '    return proteina',
    '',
    'copia = replicar(adn)',
    'arnm = transcribir(copia)       # copia y preparación',
    'prot = traducir(arnm)           # producto funcional',
    'guardar(prot)                   # escribir en memoria -> calor'
  ];

  function hash(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  function CpuView(canvas, model) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.model = model;
    this.size = { w: 400, h: 340, dpr: 1 };
    this.rand = U.rng(7771);
    this.out = model.outputs();
    this.time = 0;
    this.fanAngle = 0;
    this.pc = 0;
    this.flash = [];
    for (var i = 0; i < 16; i++) this.flash.push(0);
    this.air = [];
    for (var a = 0; a < 90; a++) this.air.push({ u: this.rand(), v: this.rand(), sp: 0.6 + this.rand() * 0.8 });
    this.traces = [];
    this.pulses = [];
  }

  CpuView.prototype.resize = function () {
    var sz = this.size = U.fitCanvas(this.canvas);
    var w = sz.w, h = sz.h;
    var S = Math.min(w * 0.34, h * 0.38);
    this.pkg = { cx: w * 0.37, cy: h * 0.31, S: S };
    this.fan = { cx: w * 0.86, cy: h * 0.15, r: Math.min(w * 0.095, h * 0.10) };
    this.ram = [
      { x: w * 0.66, y: h * 0.34, w: w * 0.31, h: h * 0.065 },
      { x: w * 0.66, y: h * 0.45, w: w * 0.31, h: h * 0.065 }
    ];
    this.panel = { x: 8, y: h * 0.62, w: w - 16, h: h * 0.38 - 8 };
    this._buildTraces();
  };

  CpuView.prototype._buildTraces = function () {
    var p = this.pkg, h = this.size.h, r = U.rng(99);
    var half = p.S / 2, L = p.cx - half, R = p.cx + half, T = p.cy - half, B = p.cy + half;
    var tr = [];
    // Alimentación: VRM (izquierda) → encapsulado
    for (var i = 0; i < 6; i++) {
      var y = T + (i + 0.5) / 6 * p.S, x0 = 6 + r() * 10;
      tr.push({ pts: [[x0, y + (i - 2.5) * 6], [L * 0.55, y + (i - 2.5) * 6], [L * 0.55, y], [L, y]], kind: 'power' });
    }
    // Buses de datos: encapsulado → RAM
    for (var j = 0; j < 8; j++) {
      var yy = T + (j + 0.5) / 8 * p.S, tgt = this.ram[j < 4 ? 0 : 1];
      var ty = tgt.y + tgt.h * (0.15 + 0.7 * ((j % 4) + 0.5) / 4);
      var xm = R + (tgt.x - R) * (0.25 + 0.5 * ((j % 4) / 4));
      tr.push({ pts: [[R, yy], [xm, yy], [xm, ty], [tgt.x, ty]], kind: 'data' });
    }
    // Hacia el panel de código (E/S)
    for (var k = 0; k < 4; k++) {
      var xx = L + (k + 0.5) / 4 * p.S;
      tr.push({ pts: [[xx, B], [xx, B + (this.panel.y - B) * 0.55 + k * 3], [xx - 18 + k * 8, B + (this.panel.y - B) * 0.55 + k * 3], [xx - 18 + k * 8, this.panel.y]], kind: 'io' });
    }

        len += Math.hypot(t.pts[q][0] - t.pts[q - 1][0], t.pts[q][1] - t.pts[q - 1][1]);

  };

  CpuView.prototype.reset = function () { this.pc = 0; for (var i = 0; i < 16; i++) this.flash[i] = 0; };

  CpuView.prototype.update = function (dt) {
    var o = this.out = this.model.outputs();
    if (dt <= 0) return;
    dt = Math.min(dt, 0.05);
    this.time += dt;
    this.fanAngle += o.fan * 15 * dt;

    var ueff = o.powered ? o.load * o.duty : 0;
    var rate = o.powered ? 0.25 + o.gips * 0.55 : 0;
    this.pc += rate * dt;

    for (var i = 0; i < 16; i++) {
      this.flash[i] = Math.max(0, this.flash[i] - dt * 5);
      if (this.rand() < dt * (0.8 + 7 * ueff * (o.f / 4.5 + 0.3))) this.flash[i] = 1;
    }

    // Pulsos eléctricos ∝ potencia
    var act = o.powered ? U.clamp(o.Pel / 140, 0, 1.2) : 0;
    var speed = (0.05 + 0.55 * act) * dt;
    for (var p = 0; p < this.pulses.length; p++) {
      this.pulses[p].s += speed * (0.8 + hash(p) * 0.4);
      if (this.pulses[p].s > 1) this.pulses[p].s -= 1;
    }

    // Flujo de aire ∝ ventilador
    var fl = o.fan;
    for (var a = 0; a < this.air.length; a++) {
      var q = this.air[a];
      q.u -= fl * 0.55 * q.sp * dt;
      if (q.u < 0) { q.u += 1; q.v = this.rand(); }
    }
  };

  CpuView.prototype._tpos = function (t, s) {
    var pts = t.pts, d = s * t.len;
    for (var i = 1; i < pts.length; i++) {
      if (d <= t.cum[i]) {
        var u = (d - t.cum[i - 1]) / (t.cum[i] - t.cum[i - 1] || 1);
        return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * u, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u];
      }
    }
    return pts[pts.length - 1];
  };

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  CpuView.prototype.draw = function () {
    var ctx = this.ctx, sz = this.size, o = this.out, p = this.pkg;
    ctx.setTransform(sz.dpr, 0, 0, sz.dpr, 0, 0);
    ctx.clearRect(0, 0, sz.w, sz.h);
    if (!p) return;

    var heat = U.clamp((o.Tc - o.TambC) / 70, 0, 1);
    var tN = function (c) { return U.clamp((c - 20) / 90, 0, 1); };
    var half = p.S / 2, L = p.cx - half, T = p.cy - half;

    // Placa base
    var bg = ctx.createLinearGradient(0, 0, 0, sz.h * 0.62);
    bg.addColorStop(0, 'rgba(10,36,56,0.9)'); bg.addColorStop(1, 'rgba(6,22,38,0.9)');
    ctx.fillStyle = bg;
    rrect(ctx, 6, 6, sz.w - 12, sz.h * 0.62 - 10, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(80,190,255,0.22)'; ctx.lineWidth = 1; ctx.stroke();

    // Resplandor térmico

      var gl = ctx.createRadialGradient(p.cx, p.cy, p.S * 0.2, p.cx, p.cy, p.S * 1.15);
      gl.addColorStop(0, U.thermal(tN(o.Tc), 0.55 * heat + 0.05));
      gl.addColorStop(1, U.thermal(tN(o.Tc), 0));
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(p.cx, p.cy, p.S * 1.15, 0, Math.PI * 2); ctx.fill();
    }

    // Pistas
    var k, i;
    for (k = 0; k < this.traces.length; k++) {
      var tr = this.traces[k];
      ctx.strokeStyle = tr.kind === 'power' ? 'rgba(255,200,80,0.22)' : tr.kind === 'data' ? 'rgba(80,230,170,0.22)' : 'rgba(80,190,255,0.20)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (i = 0; i < tr.pts.length; i++) i ? ctx.lineTo(tr.pts[i][0], tr.pts[i][1]) : ctx.moveTo(tr.pts[i][0], tr.pts[i][1]);
      ctx.stroke();
    }
    if (o.powered) {
      for (k = 0; k < this.pulses.length; k++) {
        var pu = this.pulses[k], t2 = this.traces[pu.tr], pos = this._tpos(t2, pu.s);
        ctx.fillStyle = t2.kind === 'power' ? 'rgba(255,214,110,0.95)' : t2.kind === 'data' ? 'rgba(110,255,190,0.95)' : 'rgba(120,210,255,0.95)';
        ctx.beginPath(); ctx.arc(pos[0], pos[1], 2.4, 0, Math.PI * 2); ctx.fill();
      }

    // VRM / suministro
    ctx.fillStyle = 'rgba(255,200,80,0.18)';
    rrect(ctx, 8, T - 4, 26, p.S + 8, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,80,0.6)'; ctx.stroke();
    ctx.save();
    ctx.translate(26, p.cy); ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'rgba(255,214,120,0.95)'; ctx.font = '600 10px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚡ SUMINISTRO ELÉCTRICO', 0, 0);
    ctx.restore();

    // RAM
    for (k = 0; k < this.ram.length; k++) {
      var rm = this.ram[k];
      ctx.fillStyle = 'rgba(20,60,50,0.95)';
      rrect(ctx, rm.x, rm.y, rm.w, rm.h, 4); ctx.fill();
      ctx.strokeStyle = 'rgba(100,255,190,0.5)'; ctx.lineWidth = 1; ctx.stroke();
      var cw = (rm.w - 10) / 8;
      for (i = 0; i < 8; i++) {
        var fi = this.flash[(k * 8 + i) % 16];
        ctx.fillStyle = 'rgba(' + Math.round(20 + 90 * fi) + ',' + Math.round(70 + 185 * fi) + ',' + Math.round(70 + 130 * fi) + ',0.95)';
        ctx.fillRect(rm.x + 5 + i * cw + 1.5, rm.y + 4, cw - 3, rm.h - 8);
      }
    }
    ctx.fillStyle = 'rgba(150,240,200,0.9)'; ctx.font = '600 10px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('MEMORIA RAM', this.ram[0].x, this.ram[0].y - 3);

    // Disipador: aletas arriba y abajo
    var nF = 14, fw = p.S / nF, fh = p.S * 0.13;
    var tFin = o.TambC + (o.Tc - o.TambC) * 0.7;
    ctx.fillStyle = U.thermal(tN(tFin), 0.85);
    for (i = 0; i < nF; i++) {
      ctx.fillRect(L + i * fw + fw * 0.15, T - fh - 3, fw * 0.7, fh);
      ctx.fillRect(L + i * fw + fw * 0.15, T + p.S + 3, fw * 0.7, fh);
    }

    ctx.fillStyle = '#16283b';

    for (i = 0; i < 16; i++) {

      var col = U.thermalRGB(tN(tcore));
      var x = dx + cx * cs + 3, y = dy + cy * cs + 3;
      ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
      ctx.globalAlpha = o.powered ? 0.9 : 0.35;

<script>
/**
 * BIOCODE · vistas · center-panel.js
 * ---------------------------------------------------------------------------

 * directamente de las salidas de los modelos (cell.outputs() / cpu.outputs()).
 *   1. Temperatura (°C)
 *   2. Calor cedido Q (mW la célula, W el procesador)
 *   3. Estado estructural: % de proteínas nativas (célula) frente al margen
 *      térmico hasta la temperatura crítica (procesador)
 * Las magnitudes de ambos sistemas no son comparables 1:1 (mW frente a W), así que
 * cada barra se normaliza con una referencia propia, indicada en el atributo title.

(function (root) {

    },

      cpu: function (p) { return { v: D.P(p.Qout), sub: p.Qout < 0 ? 'recibe calor del ambiente' : '', bar: p.Qout / PN(), tip: 'Barra: 0–' + PN() + ' W' }; }

<script>
/**
 * BIOCODE · datos · genetic-code.js
 * ---------------------------------------------------------------------------
 * Código genético y utilidades de secuencias. La tabla de codones está transcrita
 * de Avery (2003), tabla 3.1, p. 46 (ADN, hebra codificante; Ter = codón de paro).
 * La clasificación de los aminoácidos en hidrofóbicos / polares / ácidos / básicos es
 * de bioquímica general (Avery, cap. 5, pp. 98–99, solo distingue hidrofílicos e
 * hidrofóbicos); se usa para colorear las piezas LEGO y para el plegamiento esquemático.
 */
(function (root) {
  'use strict';
  var BC = root.BioCode;

  var ROWS = [
    'TTT=Phe TCT=Ser TAT=Tyr TGT=Cys', 'TTC=Phe TCC=Ser TAC=Tyr TGC=Cys',
    'TTA=Leu TCA=Ser TAA=Ter TGA=Ter', 'TTG=Leu TCG=Ser TAG=Ter TGG=Trp',
    'CTT=Leu CCT=Pro CAT=His CGT=Arg', 'CTC=Leu CCC=Pro CAC=His CGC=Arg',
    'CTA=Leu CCA=Pro CAA=Gln CGA=Arg', 'CTG=Leu CCG=Pro CAG=Gln CGG=Arg',
    'ATT=Ile ACT=Thr AAT=Asn AGT=Ser', 'ATC=Ile ACC=Thr AAC=Asn AGC=Ser',
    'ATA=Ile ACA=Thr AAA=Lys AGA=Arg', 'ATG=Met ACG=Thr AAG=Lys AGG=Arg',
    'GTT=Val GCT=Ala GAT=Asp GGT=Gly', 'GTC=Val GCC=Ala GAC=Asp GGC=Gly',
    'GTA=Val GCA=Ala GAA=Glu GGA=Gly', 'GTG=Val GCG=Ala GAG=Glu GGG=Gly'
  ];

  var CODON = {};
  ROWS.forEach(function (r) { r.split(' ').forEach(function (e) { var p = e.split('='); CODON[p[0]] = p[1]; }); });

  // clase: np = hidrofóbico, pol = polar sin carga, ac = ácido (carga −), ba = básico (carga +)
  var AA = {
    Ala: { one: 'A', name: 'Alanina', cls: 'np' },        Arg: { one: 'R', name: 'Arginina', cls: 'ba' },
    Asn: { one: 'N', name: 'Asparagina', cls: 'pol' },     Asp: { one: 'D', name: 'Ácido aspártico', cls: 'ac' },
    Cys: { one: 'C', name: 'Cisteína', cls: 'pol' },        Gln: { one: 'Q', name: 'Glutamina', cls: 'pol' },
    Glu: { one: 'E', name: 'Ácido glutámico', cls: 'ac' },  Gly: { one: 'G', name: 'Glicina', cls: 'np' },
    His: { one: 'H', name: 'Histidina', cls: 'ba' },        Ile: { one: 'I', name: 'Isoleucina', cls: 'np' },
    Leu: { one: 'L', name: 'Leucina', cls: 'np' },          Lys: { one: 'K', name: 'Lisina', cls: 'ba' },
    Met: { one: 'M', name: 'Metionina', cls: 'np' },        Phe: { one: 'F', name: 'Fenilalanina', cls: 'np' },
    Pro: { one: 'P', name: 'Prolina', cls: 'np' },          Ser: { one: 'S', name: 'Serina', cls: 'pol' },
    Thr: { one: 'T', name: 'Treonina', cls: 'pol' },        Trp: { one: 'W', name: 'Triptófano', cls: 'np' },
    Tyr: { one: 'Y', name: 'Tirosina', cls: 'pol' },        Val: { one: 'V', name: 'Valina', cls: 'np' },
    Ter: { one: '*', name: 'Paro', cls: 'stop' }
  };
  var CLASS = {
    np:   { label: 'hidrofóbico', color: '#f5c542' },
    pol:  { label: 'polar sin carga', color: '#2dd4bf' },
    ac:   { label: 'ácido (−)', color: '#ff6b81' },
    ba:   { label: 'básico (+)', color: '#5aa9ff' },
    stop: { label: 'paro', color: '#9aa7b4' }
  };
  var COMP = { A: 'T', T: 'A', G: 'C', C: 'G' };
  var BASE_BITS = { A: '00', C: '01', G: '10', T: '11' };      // codificación de 2 bits por base (convención del proyecto)

  function complement(dna) { var o = ''; for (var i = 0; i < dna.length; i++) o += COMP[dna[i]] || 'N'; return o; }
  function transcribe(dna) { return dna.replace(/T/g, 'U'); }
  function codons(dna) { var a = []; for (var i = 0; i + 3 <= dna.length; i += 3) a.push(dna.substr(i, 3)); return a; }

  /** Traduce desde el primer codón hasta el codón de paro (excluido) o el fin de la secuencia. */
  function translate(dna) {
    var cs = codons(dna), out = [], stopped = false;
    for (var i = 0; i < cs.length; i++) {
      var a = CODON[cs[i]];
      if (a === 'Ter') { stopped = true; break; }
      out.push(a);
    }
    return { aas: out, stopped: stopped, leftover: dna.length % 3 };
  }

  /** Entropía (bits) del reparto de los 64 codones entre 21 salidas (20 aa + paro), codones equiprobables. */
  function translationEntropyBits() {
    var n = {}, k;
    Object.keys(CODON).forEach(function (c) { n[CODON[c]] = (n[CODON[c]] || 0) + 1; });
    var h = 0;
    for (k in n) { var p = n[k] / 64; h -= p * Math.log(p) / Math.LN2; }
    return h;
  }

  /** Entropía de Shannon (bits/base) de las frecuencias de bases de una secuencia. */
  function baseEntropy(dna) {
    var c = { A: 0, C: 0, G: 0, T: 0 }, n = 0, i;
    for (i = 0; i < dna.length; i++) if (c[dna[i]] !== undefined) { c[dna[i]]++; n++; }
    var h = 0;
    for (var b in c) if (c[b] > 0) { var p = c[b] / n; h -= p * Math.log(p) / Math.LN2; }
    return h;
  }

  /** Aplica una mutación y devuelve la nueva secuencia. kind: 'sub' | 'ins' | 'del'. pos 0-indexada. */
  function mutate(dna, kind, pos, base) {
    pos = Math.max(0, Math.min(dna.length - 1, pos));
    if (kind === 'sub') return dna.substr(0, pos) + base + dna.substr(pos + 1);
    if (kind === 'ins') return dna.substr(0, pos) + base + dna.substr(pos);
    if (kind === 'del') return dna.substr(0, pos) + dna.substr(pos + 1);
    return dna;
  }

  /** Compara dos proteínas y clasifica el efecto de la mutación (terminología estándar). */
  function classify(wtDna, mutDna) {
    var a = translate(wtDna), b = translate(mutDna), i, changed = 0;
    var n = Math.max(a.aas.length, b.aas.length);
    for (i = 0; i < n; i++) if (a.aas[i] !== b.aas[i]) changed++;
    var res = { changed: changed, lenWt: a.aas.length, lenMut: b.aas.length, stopped: b.stopped };
    var dl = mutDna.length - wtDna.length;
    if (wtDna === mutDna) { res.code = 'none'; res.label = 'Sin mutación'; }
    else if (dl % 3 !== 0) { res.code = 'frameshift'; res.label = 'Cambio de marco de lectura'; }
    else if (dl !== 0) { res.code = 'inframe'; res.label = dl > 0 ? 'Inserción en marco (3 bases)' : 'Deleción en marco (3 bases)'; }
    else if (b.stopped && b.aas.length < a.aas.length) { res.code = 'nonsense'; res.label = 'Sin sentido (paro prematuro)'; }
    else if (a.stopped && !b.stopped) { res.code = 'readthrough'; res.label = 'Pérdida del codón de paro'; }
    else if (changed === 0) { res.code = 'silent'; res.label = 'Silenciosa (mismo aminoácido)'; }
    else { res.code = 'missense'; res.label = 'De cambio de sentido (otro aminoácido)'; }
    return res;
  }

  BC.Genetics = {
    ROWS: ROWS, CODON: CODON, AA: AA, CLASS: CLASS, BASE_BITS: BASE_BITS, COMP: COMP,
    complement: complement, transcribe: transcribe, codons: codons, translate: translate,
    translationEntropyBits: translationEntropyBits, baseEntropy: baseEntropy, mutate: mutate, classify: classify
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/**
 * BIOCODE · módulos · host.js

 * especificación (BioCode.Modules.define) con su propio modelo; el marco aporta
 * lo que es igual en todos:
 *   - pantalla dual: panel biológico | centro (resultados) | panel informático
 *   - controles (deslizadores, selectores, botones), Iniciar/Pausar/Reiniciar, velocidad
 *   - bucle de paso fijo (dt = 0,02 s simulados), estado y texto dinámico
 *
 * Contrato de una instancia (devuelta por spec.create(env)):
 *   reset(v)  step(dt, v)  draw(capa, g, w, h, v, t, dpr)   capa = 'bio' | 'cpu' | 'mid'
 *   opcionales: update(dtView, v)  eqs(v)  readouts(v)  status(v)  caption(capa, v)
 *               onControl(id, valor, v)  press(id, v)  controlMeta(v)  click(capa, x, y, w, h, v)

  }
