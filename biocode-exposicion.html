    }

    var ctl = { bio: [], cpu: [], sim: [] };
    (spec.controls || []).forEach(function (c) { (ctl[c.group || 'sim'] || ctl.sim).push(c); });
    var ctr = spec.center || {};

    h += '<div class="mod__grid">';
    h += '<section class="world world--bio"><header class="world__head"><h2><span class="dot dot--bio"></span>' + (spec.bioTitle || 'Célula') + ' <small>' + (spec.bioSub || '') + '</small></h2><span class="status status--ok" data-st="bio"></span></header>' +
         '<div class="viewport mod__vp"><canvas data-c="bio"></canvas></div><p class="mod__cap" data-cap="bio"></p></section>';
    h += '<section class="center mod__center"><header class="center__head"><h2>' + (spec.centerTitle || 'Resultados') + '</h2></header>';
    if (ctr.mid) h += '<div class="viewport mod__mid" style="height:' + (ctr.midH || 220) + 'px"><canvas data-c="mid"></canvas></div><p class="mod__cap" data-cap="mid"></p>';
    h += '<div class="mod__reads" data-reads></div>';
    h += '</section>';
    h += '<section class="world world--cpu"><header class="world__head"><h2><span class="dot dot--cpu"></span>' + (spec.cpuTitle || 'Computadora') + ' <small>' + (spec.cpuSub || '') + '</small></h2><span class="status status--ok" data-st="cpu"></span></header>' +
         '<div class="viewport mod__vp"><canvas data-c="cpu"></canvas></div><p class="mod__cap" data-cap="cpu"></p></section>';
    h += '</div>';

    h += '<footer class="controls mod__ctl">';
    h += '<div class="ctl ctl--bio"><h3>' + (spec.bioTitle || 'Célula') + '</h3><div class="sliders">' + ctl.bio.map(controlHTML).join('') + '</div></div>';
    h += '<div class="ctl ctl--sim"><h3>Simulación</h3>' +
         '<div class="row"><button class="btn btn--primary" type="button" data-act="play">Pausar</button><button class="btn" type="button" data-act="reset" title="Reinicia el modelo del módulo (tecla R)">↺ Reiniciar</button></div>' +
         '<div class="row" role="group" aria-label="Velocidad de simulación"><span class="lbl">Velocidad</span>' + (spec.speeds || [1, 2, 5, 10]).map(function (s) { return '<button class="btn btn--seg" type="button" data-speed="' + s + '">×' + s + '</button>'; }).join('') + '</div>' +
         (spec.presets ? '<div class="row row--wrap">' + spec.presets.map(function (p, i) { return '<button class="btn btn--preset" type="button" data-preset="' + i + '">' + p.label + '</button>'; }).join('') + '</div>' : '') +
         '<div class="sliders sliders--sim">' + ctl.sim.map(controlHTML).join('') + '</div></div>';
    h += '<div class="ctl ctl--cpu"><h3>' + (spec.cpuTitle || 'Computadora') + '</h3><div class="sliders">' + ctl.cpu.map(controlHTML).join('') + '</div></div>';
    h += '</footer>';

    h += '<section class="mod__eqwrap"><div class="mod__eqs" data-eqs></div></section>';
    el.innerHTML = h;
    return el;
  }

  // ---------------------------------------------------------------- instancia
  function Mod(spec, el) {
    this.spec = spec; this.el = el; this.vals = {}; this.t = 0; this.acc = 0;
    this.running = true; this.speed = spec.defaultSpeed || 1; this.last = null; this.uiAcc = 1; this.eqAcc = 1;
    this.canvas = {};
    var self = this;
    $$('canvas[data-c]', el).forEach(function (c) { self.canvas[c.getAttribute('data-c')] = c; });
    (spec.controls || []).forEach(function (c) { self.vals[c.id] = c.type === 'button' ? 0 : c.def; });
    this.inst = spec.create({ canvas: this.canvas, vals: this.vals, mod: this });
    this.bind();
    if (spec.mount) spec.mount(this.el, this);
    this.reset();
  }

  Mod.prototype.fmtOut = function (c, v) { return c.fmt ? c.fmt(v) : String(v); };

  Mod.prototype.refreshControls = function () {
    var self = this, spec = this.spec;
    (spec.controls || []).forEach(function (c) {
      var t = c.type || 'range', inp = $('[data-ctl="' + c.id + '"]', self.el);
      if (!inp) return;
      if (t === 'range') {
        inp.value = self.vals[c.id];
        var out = $('[data-out="' + c.id + '"]', self.el);
        if (out) out.textContent = self.fmtOut(c, +self.vals[c.id]);
      } else if (t === 'select') { inp.value = self.vals[c.id]; }
      else if (t === 'check') { inp.checked = !!self.vals[c.id]; }
    });
  };

  Mod.prototype.applyMeta = function () {
    if (!this.inst.controlMeta) return;
    var meta = this.inst.controlMeta(this.vals), self = this;
    Object.keys(meta).forEach(function (id) {
      var m = meta[id], inp = $('[data-ctl="' + id + '"]', self.el), lab = $('[data-lab="' + id + '"]', self.el);
      if (!inp) return;
      var wrap = inp.closest('.slider') || inp.closest('.check') || (inp.tagName === 'BUTTON' ? inp : null);
      if (m.hidden !== undefined && wrap) wrap.style.display = m.hidden ? 'none' : '';
      if (m.label && lab) lab.textContent = m.label;
      if (m.min !== undefined) inp.min = m.min;
      if (m.max !== undefined) inp.max = m.max;
      if (m.step !== undefined) inp.step = m.step;
      if (m.val !== undefined) { inp.value = m.val; self.vals[id] = +m.val; }
      if (m.fmt) { var spec = (self.spec.controls || []).filter(function (c) { return c.id === id; })[0]; if (spec) spec.fmt = m.fmt; }
      var out = $('[data-out="' + id + '"]', self.el);
      var cs = (self.spec.controls || []).filter(function (c) { return c.id === id; })[0];
      if (out && cs) out.textContent = self.fmtOut(cs, +inp.value);
    });
  };

  Mod.prototype.bind = function () {
    var self = this, spec = this.spec, el = this.el;
    (spec.controls || []).forEach(function (c) {
      var inp = $('[data-ctl="' + c.id + '"]', el), t = c.type || 'range';
      if (!inp) return;
      if (t === 'button') {
        inp.addEventListener('click', function () { if (self.inst.press) self.inst.press(c.id, self.vals); self.forceUI(); });
      } else if (t === 'check') {
        inp.addEventListener('change', function () { self.vals[c.id] = inp.checked ? 1 : 0; if (self.inst.onControl) self.inst.onControl(c.id, self.vals[c.id], self.vals); self.applyMeta(); self.forceUI(); });
      } else if (t === 'select') {
        inp.addEventListener('change', function () { self.vals[c.id] = inp.value; if (self.inst.onControl) self.inst.onControl(c.id, inp.value, self.vals); self.applyMeta(); self.forceUI(); });
      } else {
        inp.addEventListener('input', function () {
          self.vals[c.id] = +inp.value;
          var out = $('[data-out="' + c.id + '"]', el); if (out) out.textContent = self.fmtOut(c, +inp.value);
          if (self.inst.onControl) self.inst.onControl(c.id, +inp.value, self.vals);
          self.forceUI();
        });
      }
    });
    $('[data-act="play"]', el).addEventListener('click', function () { self.setRunning(!self.running); });
    $('[data-act="reset"]', el).addEventListener('click', function () { self.reset(); });
    $$('[data-speed]', el).forEach(function (b) {
      b.addEventListener('click', function () { self.speed = +b.getAttribute('data-speed'); self.markSpeed(); });
    });
    $$('[data-preset]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var p = spec.presets[+b.getAttribute('data-preset')];
        Object.keys(p.set).forEach(function (id) {
          self.vals[id] = p.set[id];
          var inp = $('[data-ctl="' + id + '"]', el);
          if (inp) { if (inp.type === 'checkbox') inp.checked = !!p.set[id]; else inp.value = p.set[id]; }
          if (self.inst.onControl) self.inst.onControl(id, p.set[id], self.vals);
        });
        self.applyMeta(); self.refreshControls(); self.forceUI();
      });
    });
    var vps = $$('.viewport', el);
    if (root.ResizeObserver) { var ro = new ResizeObserver(function () { if (active === self) self.drawAll(); }); vps.forEach(function (v) { ro.observe(v); }); }
    // clic sobre un lienzo → el módulo decide qué hacer (p. ej. elegir una base del ADN)
    ['bio', 'cpu', 'mid'].forEach(function (layer) {
      var c = self.canvas[layer];
      if (c) c.addEventListener('click', function (e) {
        if (!self.inst.click) return;
        var r = c.getBoundingClientRect();
        self.inst.click(layer, e.clientX - r.left, e.clientY - r.top, r.width, r.height, self.vals);
        self.applyMeta(); self.refreshControls(); self.forceUI();
      });
    });
    this.markSpeed();
  };

  Mod.prototype.markSpeed = function () {
    var self = this;
    $$('[data-speed]', this.el).forEach(function (b) { b.classList.toggle('is-active', +b.getAttribute('data-speed') === self.speed); });
  };

  Mod.prototype.setRunning = function (r) {
    this.running = r;
    $('[data-act="play"]', this.el).textContent = r ? 'Pausar' : 'Iniciar';
  };

  Mod.prototype.reset = function () {
    this.t = 0; this.acc = 0;
    this.inst.reset(this.vals);
    this.applyMeta(); this.refreshControls();
    this.forceUI();
  };

  Mod.prototype.forceUI = function () { this.uiAcc = 1; this.eqAcc = 1; if (this.running === false) this.refreshUI(true); };

  Mod.prototype.refreshUI = function () {
    var inst = this.inst, el = this.el, v = this.vals, i;
    if (inst.status) {
      var st = inst.status(v);
      ['bio', 'cpu'].forEach(function (k) {
        var b = $('[data-st="' + k + '"]', el);
        if (b && st && st[k]) { b.textContent = st[k].label; b.className = 'status status--' + st[k].level; }
        else if (b) b.style.display = 'none';
      });
    } else { $$('[data-st]', el).forEach(function (b) { b.style.display = 'none'; }); }
    ['bio', 'cpu', 'mid'].forEach(function (k) {
      var c = $('[data-cap="' + k + '"]', el);
      if (c && inst.caption) c.innerHTML = inst.caption(k, v) || '';
    });
    var reads = $('[data-reads]', el);
    if (reads && inst.readouts) {
      reads.innerHTML = inst.readouts(v).map(function (r) {
        return '<div class="rd' + (r.tone ? ' rd--' + r.tone : '') + '"><span>' + r.k + '</span><b>' + r.v + '</b></div>';
      }).join('');
    }
    var eqs = $('[data-eqs]', el);
    if (eqs && inst.eqs) {
      var e = inst.eqs(v);
      if (typeof e === 'string') eqs.innerHTML = e;
      else eqs.innerHTML = e.map(function (q) {
        return '<div class="eq"><div class="eq__top"><b>' + q.name + '</b></div><div class="eq__expr">' + q.expr + '</div>' + (q.sub ? '<div class="eq__sub">' + q.sub + '</div>' : '') + '</div>';
      }).join('');
    }
  };

  Mod.prototype.drawAll = function () {
    var self = this, inst = this.inst;
    ['bio', 'cpu', 'mid'].forEach(function (layer) {
      var c = self.canvas[layer];
      if (!c) return;
      var sz = U.fitCanvas(c), g = c.getContext('2d');
      g.setTransform(sz.dpr, 0, 0, sz.dpr, 0, 0);
      g.clearRect(0, 0, sz.w, sz.h);
      inst.draw(layer, g, sz.w, sz.h, self.vals, self.t, sz.dpr);
    });
  };

  Mod.prototype.frame = function (ts) {
    if (this.last === null) this.last = ts;
    var real = Math.min(0.1, (ts - this.last) / 1000);
    this.last = ts;
    var dtView = 0;
    if (this.running) {
      this.acc += real * this.speed;
      var n = Math.min(MAX_STEPS, Math.floor(this.acc / DT));
      this.acc -= n * DT; if (n === MAX_STEPS) this.acc = 0;
      for (var k = 0; k < n; k++) {
        this.inst.step(DT, this.vals);
        this.t += DT;
      }
      dtView = real * Math.min(this.speed, 3);
    }
    if (this.inst.update) this.inst.update(dtView, this.vals);
    this.drawAll();
    this.uiAcc += real;
    if (this.uiAcc >= 0.12) { this.uiAcc = 0; this.refreshUI(); }
  };

  // ---------------------------------------------------------------- navegación
  function loop(ts) {
    if (!active) return;
    active.frame(ts);
    rafId = requestAnimationFrame(loop);
  }

  function open(id) {
    if (id === current) return;
    if (current === 'main') { mainWasRunning = BC.Engine.isRunning(); BC.Engine.pause(); }
    if (active) { cancelAnimationFrame(rafId); active = null; }
    var prev = built[current]; if (prev) prev.el.hidden = true;        // también los módulos de tipo panel (calculadora)
    current = id;
    document.body.setAttribute('data-view', id);
    if (id === 'main') {
      if (mainWasRunning) BC.Engine.start();
      root.dispatchEvent(new Event('resize'));
      return;
    }
    var spec = defs[id];
    if (!built[id]) {
      var el = buildScreen(spec);
      $('#moduleHost').appendChild(el);
      built[id] = { el: el, mod: null };
      if (spec.type === 'panel') { spec.build($('[data-panel]', el)); }
      else { el.hidden = false; built[id].mod = new Mod(spec, el); }
    }
    built[id].el.hidden = false;
    if (spec.type !== 'panel') {
      active = built[id].mod;
      active.last = null;
      rafId = requestAnimationFrame(loop);
    }
    var scroller = document.scrollingElement || document.documentElement; scroller.scrollTop = 0;
  }

  function init() {
    document.addEventListener('keydown', function (e) {
      if (current === 'main' || !active) return;
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'BUTTON' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); active.setRunning(!active.running); }
      else if (e.key === 'r' || e.key === 'R') active.reset();
    });
  }

  BC.Modules = {
    define: define, open: open, init: init,
    current: function () { return current; },
    defs: defs, order: order,
    /** Acceso para pruebas: devuelve el objeto Mod de un módulo ya abierto. */
    get: function (id) { return built[id] && built[id].mod; }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/**
 * BIOCODE · actividad 1 · Balance de energía en vivo  (ΔU = Q − W)
 * ---------------------------------------------------------------------------
 * Reutiliza los MISMOS modelos del simulador principal (cell-model y cpu-model) y
 * lleva un libro de cuentas de energía acumulada de cada uno:
 *
 *   célula (sistema abierto):   E_entrada = Q_cedido + W + ΔU          (ΔU = ΔU térmica + ΔE_ATP)
 *   procesador:                 E_entrada = Q_cedido + ΔU              (W mecánico = 0)
 *
 * Convención del proyecto: ΔU = Q − W, con Q > 0 si el sistema RECIBE calor y W > 0 si el
 * sistema REALIZA trabajo. (Avery, apéndice A, escribe dU = dq + dw con w sobre el sistema;
 * son equivalentes con W = −w.) La energía que entra (glucosa o electricidad) se cuenta como
 * entrada explícita. El residuo del balance es solo el error numérico del método de Euler.
 *
 * Presentación: tres valores por sistema (entrada, trabajo W, calor cedido Q) en W o mW,
 * y el reparto acumulado en %. Sin escalas logarítmicas ni notación científica.
 */
(function (root) {
  'use strict';
  var BC = root.BioCode, U = BC.Util, T = BC.Thermo, D = BC.Draw, num = U.num;

  /** Libro de cuentas de la célula a partir de su estado y acumuladores. */
  function cellLedger(cell) {
    var a = cell.acc, s = cell.state;
    var dUth = BC.CellModel.Cth * (s.T - a.T0);
    var dEatp = BC.CellModel.kAtp * (s.ATP - a.ATP0);
    return { Ein: a.Ein, Qout: a.Qout, W: a.W, dUth: dUth, dEatp: dEatp, dU: dUth + dEatp,
             residual: a.Ein - a.Qout - a.W - dUth - dEatp };
  }
  function cpuLedger(cpu) {
    var a = cpu.acc, s = cpu.state;
    var dUth = cpu.params.Cth * (s.T - a.T0);
    return { Ein: a.Ein, Qout: a.Qout, W: 0, dUth: dUth, dU: dUth, residual: a.Ein - a.Qout - dUth };
  }

  BC.Calc = BC.Calc || {};
  BC.Calc.m3 = { cellLedger: cellLedger, cpuLedger: cpuLedger };

  function create() {
    var cell = BC.CellModel.create(), cpu = BC.CpuModel.create();

    function sync(v) {
      cell.inputs.activity = v.activity; cell.inputs.supply = v.supply; cell.inputs.Tenv = T.cToK(37);
      cpu.inputs.load = v.load; cpu.inputs.fan = 0.6; cpu.inputs.Tamb = T.cToK(25); cpu.inputs.supply = 1;
    }

    /** Diagrama de bloques: una caja (sistema) con la entrada, el trabajo W y el calor cedido Q. */
    function flows(g, w, h, o) {
      D.backdrop(g, w, h, o.tint);
      var sc = U.clamp(Math.min(w / 400, h / 340), 1, 1.7);            // tamaño de texto para proyectar
      var bx = w * 0.34, by = h * 0.32, bw = w * 0.32, bh = h * 0.34, cy = by + bh / 2;
      var col = U.thermalRGB(U.clamp((o.Tc - 15) / 95, 0, 1));
      g.fillStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.25)'; D.rrect(g, bx, by, bw, bh, 12); g.fill();
      g.lineWidth = 2.5; g.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.95)'; D.rrect(g, bx, by, bw, bh, 12); g.stroke();
      D.text(g, o.name, bx + bw / 2, by + bh * 0.24, { size: 14 * sc, bold: true, align: 'center', color: o.color });
      D.text(g, o.sub, bx + bw / 2, by + bh * 0.44, { size: 11 * sc, align: 'center', color: D.COL.muted });
      D.text(g, num(o.Tc, 0) + ' °C', bx + bw / 2, by + bh * 0.72, { size: 18 * sc, bold: true, align: 'center' });

      var ref = Math.max(o.pin, 1e-12);
      function wd(p) { return (2 + 22 * U.clamp(Math.abs(p) / ref, 0, 1.2)) * Math.min(sc, 1.4); }
      // entrada de energía
      D.arrow(g, 8, cy, bx - 2, cy, D.COL.heat, wd(o.pin), 12 * sc);
      D.text(g, 'Energía', 8, cy - 20 * sc - wd(o.pin) / 2, { size: 13 * sc, bold: true, color: D.COL.heat });
      D.text(g, D.P(o.pin), 8, cy + 20 * sc + wd(o.pin) / 2, { size: 15 * sc, bold: true, color: D.COL.heat });
      // calor cedido (flecha roja lateral)
      var xq = bx + bw + 2, yq = cy - bh * 0.1;
      D.arrow(g, xq, yq, w - 8, yq, D.COL.red, wd(o.qout), 12 * sc);
      D.text(g, 'Calor cedido Q', w - 8, yq - 20 * sc - wd(o.qout) / 2, { size: 13 * sc, bold: true, align: 'right', color: D.COL.red });
      D.text(g, D.P(o.qout), w - 8, yq + 20 * sc + wd(o.qout) / 2, { size: 15 * sc, bold: true, align: 'right', color: D.COL.red });
      // trabajo W (salida superior)
      var xw = bx + bw * 0.5;
      if (o.wp > 1e-9) {
        D.arrow(g, xw, by - 2, xw, by * 0.22, D.COL.violet, wd(o.wp), 11 * sc);
        D.text(g, 'Trabajo W', xw + 16 * sc, by * 0.46, { size: 13 * sc, bold: true, color: D.COL.violet });
        D.text(g, D.P(o.wp), xw + 16 * sc, by * 0.46 + 20 * sc, { size: 15 * sc, bold: true, color: D.COL.violet });
      } else {
        D.text(g, 'Trabajo W = 0', xw, by * 0.5, { size: 13 * sc, bold: true, align: 'center', color: D.COL.muted });
      }
    }

    function pct(x, base) { return Math.round(x / Math.max(base, 1e-12) * 100); }
    function sgn(n) { return (n < 0 ? '−' : '') + Math.abs(n); }

    /** Lleva los dos modelos a su régimen estacionario (≈10 min simulados, ~30 ms de cálculo). */
    function warm(v) {
      sync(v); cell.reset(); cpu.reset();
      for (var i = 0; i < 30000; i++) { cell.step(0.02); cpu.step(0.02); }
      restart();
    }
    /** Pone a cero el libro de cuentas (energía acumulada) sin tocar el estado de los modelos. */
    function restart() {
      cell.acc = { Ein: 0, W: 0, Qout: 0, T0: cell.state.T, ATP0: cell.state.ATP };
      cpu.acc = { Ein: 0, Qout: 0, T0: cpu.state.T };
    }

    var inst = {
      reset: function (v) { warm(v); },
      onControl: function (id, val, v) { sync(v); restart(); },
      step: function (dt, v) { sync(v); cell.step(dt); cpu.step(dt); },
      status: function () {
        var a = cell.status(), b = cpu.status();
        return { bio: { label: a.label, level: a.level }, cpu: { label: b.label, level: b.level } };
      },
      caption: function (layer) {
        if (layer === 'bio') return 'Sistema abierto: la glucosa entra con su energía; una parte queda en ATP y trabajo, el resto sale como calor.';
        if (layer === 'cpu') return 'La electricidad entra al procesador y casi toda sale como calor; su trabajo útil es información.';
        return 'Reparto acumulado de la energía que entró (100 %).';
      },
      eqs: function (v) {
        var lc = cellLedger(cell), rp = cpu.rates();
        var I = rp.V > 0 ? rp.Pel / rp.V : 0;
        return [
          { name: 'Primera ley', expr: 'ΔU = Q − W', sub: 'Entrada = W + Q cedido + ΔU' },
          { name: 'Potencia', expr: 'P = V·I', sub: 'Procesador: ' + num(rp.V, 1) + ' V × ' + num(I, 0) + ' A = ' + D.P(rp.Pel) },
          { name: 'Eficiencia', expr: 'η = (W / E<sub>entrada</sub>) · 100', sub: 'Célula: ' + pct(lc.W, lc.Ein) + ' % · Procesador: 0 %' }
        ];
      },
      draw: function (layer, g, w, h, v, t) {
        var lc = cellLedger(cell), lp = cpuLedger(cpu), rc = cell.rates(), rp = cpu.rates();
        if (layer === 'bio') {
          flows(g, w, h, { tint: ['#07231f', '#030a14'], name: 'CÉLULA', sub: '(sistema abierto)', color: D.COL.bio, Tc: T.kToC(cell.state.T),
            pin: rc.Pchem, qout: rc.Qout, wp: rc.W });
        } else if (layer === 'cpu') {
          flows(g, w, h, { tint: ['#071a33', '#030a14'], name: 'PROCESADOR', sub: '(energía eléctrica)', color: D.COL.cpu, Tc: rp.Tc,
            pin: rp.Pel, qout: rp.Qout, wp: 0 });
        } else {
          D.backdrop(g, w, h);
          var sc = U.clamp(w / 360, 1, 1.9);

          var rows = [

      });
      form.textContent = cur.f;

      big.innerHTML = '<span class="calc__bk">' + esc(cur.out.k) + ' =</span> <b>' + sign + fmt(c.r) + '</b> <small>' + esc(cur.out.unit) + '</small>';
      extra.textContent = c.extra ? c.extra.k + ' = ' + fmt(c.extra.v) + ' ' + c.extra.unit : '';

    }

    function select(id) {
      cur = byId(id);
      Array.prototype.forEach.call(tabs.children, function (b) { b.classList.toggle('is-active', b.getAttribute('data-id') === id); });

    api = {
      select: select,
      reset: function () { FORMULAS.forEach(function (F) { state[F.id] = defaults(F); }); select(FORMULAS[0].id); }
    };

  }

  BC.Modules.define({
    id: 'calc', num: 'Σ', type: 'panel', title: 'Calculadora de fórmulas',

})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/**
 * BIOCODE · secuencia de 8 diapositivas
 * ---------------------------------------------------------------------------
 * La aplicación arranca directamente aquí. Cada diapositiva es una pantalla completa:
 *   · portada y teoría (tipos 'cover' y 'theory'): se dibujan en #presFull;
 *   · actividades: abren el simulador principal o un módulo, lo dejan en un estado
 *     conocido (controles por defecto + escenario de la diapositiva), ocultan lo secundario
 *     con CSS (`body[data-present]`) y muestran solo lo esencial:
 *     título · pregunta · célula | resultados | computadora · fórmulas · pocos controles · idea clave;
 *   · calculadora (tipo 'panel').
 * El guion del orador (BC.Slides[i].notes) se abre con la tecla N.
 *
 * Teclas:  ← → / RePág AvPág  navegar · Inicio / Fin · I índice · N notas
 *          F pantalla completa · Espacio pausa el módulo · R reinicia
 */
(function (root) {
  'use strict';
  var BC = root.BioCode, doc = root.document;
  if (!doc || !BC || !BC.Slides) return;

  var SL = BC.Slides;
  var on = false, idx = 0, notesOn = false, refsAll = false, built = false, timer = 0, lastEqKey = '';
  var els = {};

  function $(s, r) { return (r || doc).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || doc).querySelectorAll(s)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
  function isFull(s) { return s.kind === 'cover' || s.kind === 'theory'; }

  // ------------------------------------------------------------------ DOM
  function build() {
    if (built) return;
    built = true;
    var app = $('.app');

    els.head = doc.createElement('header');
    els.head.id = 'presHead';
    els.head.innerHTML = '<span class="ph__n"></span><h2 class="ph__t"></h2><p class="ph__q"></p>';
    app.insertBefore(els.head, app.firstChild);

    els.full = doc.createElement('section');
    els.full.id = 'presFull';
    app.appendChild(els.full);

    els.idea = doc.createElement('div');
    els.idea.id = 'presIdea';
    els.idea.innerHTML = '<span class="pi__k">Idea clave</span><p class="pi__t"></p><span class="pi__src"></span>';
    app.appendChild(els.idea);

    els.bar = doc.createElement('nav');
    els.bar.id = 'presBar';
    els.bar.setAttribute('aria-label', 'Diapositivas');
    els.bar.innerHTML =
      '<button class="btn pb__btn" type="button" data-pres="prev" title="Anterior (←)">◀</button>' +
      '<span class="pb__count" data-pres-count></span>' +
      '<button class="btn pb__btn" type="button" data-pres="next" title="Siguiente (→)">▶</button>' +
      '<div class="pb__dots">' + SL.map(function (s, i) { return '<button class="pb__dot" type="button" data-i="' + i + '" title="' + (i + 1) + ' · ' + esc(s.title) + '"></button>'; }).join('') + '</div>' +
      '<button class="btn" type="button" data-pres="index" title="Índice de diapositivas (I)">Índice</button>' +
      '<button class="btn" type="button" data-pres="refs" title="Referencias y bibliografía (B)">Referencias</button>' +
      '<button class="btn" type="button" data-pres="notes" title="Notas del orador (N)">Notas</button>' +
      '<button class="btn" type="button" data-pres="full" title="Pantalla completa (F)">⛶</button>';
    app.appendChild(els.bar);

    els.notes = doc.createElement('aside');
    els.notes.id = 'presNotes'; els.notes.hidden = true;
    els.notes.setAttribute('aria-label', 'Notas del orador');
    doc.body.appendChild(els.notes);

    els.index = doc.createElement('div');
    els.index.id = 'presIndex'; els.index.hidden = true;
    els.index.innerHTML = '<div class="px__box"><div class="px__top"><h2>Índice</h2><button class="btn" type="button" data-pres="closeindex">Cerrar (Esc)</button></div><div class="px__grid">' +
      SL.map(function (s, i) {
        return '<button class="px__card" type="button" data-i="' + i + '"><b>' + (i + 1) + '</b><span>' + esc(s.title) + '</span><small>' + esc(s.idea || '') + '</small></button>';
      }).join('') + '</div></div>';
    doc.body.appendChild(els.index);

    els.refs = doc.createElement('div');
    els.refs.id = 'presRefs'; els.refs.hidden = true;
    els.refs.setAttribute('role', 'dialog'); els.refs.setAttribute('aria-label', 'Referencias');
    doc.body.appendChild(els.refs);

    els.dyn = doc.createElement('style');
    els.dyn.id = 'presDyn';
    doc.head.appendChild(els.dyn);

    els.bar.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pres],[data-i]'); if (!b) return;
      if (b.hasAttribute('data-i')) { go(+b.getAttribute('data-i')); return; }
      var a = b.getAttribute('data-pres');
      if (a === 'prev') go(idx - 1); else if (a === 'next') go(idx + 1);
      else if (a === 'index') toggleIndex(); else if (a === 'notes') toggleNotes(); else if (a === 'refs') toggleRefs();
      else if (a === 'full') toggleFull();
    });
    els.index.addEventListener('click', function (e) {
      var b = e.target.closest('[data-i],[data-pres]'); if (!b) return;
      if (b.hasAttribute('data-i')) { toggleIndex(false); go(+b.getAttribute('data-i')); }
      else toggleIndex(false);
    });
    els.refs.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pres],[data-refs-view]'); if (!b) return;
      if (b.hasAttribute('data-refs-view')) { refsAll = b.getAttribute('data-refs-view') === 'all'; renderRefs(); }

    });
    // al soltar un control, devolver el foco al documento para que las flechas sigan cambiando de diapositiva
    doc.addEventListener('change', function (e) {

    });
  }

  // ------------------------------------------------------- diapositivas
  /** «ΔS_entorno» → ΔS con subíndice. */
  function fx(t) { return esc(t).replace(/_([A-Za-zÁÉÍÓÚáéíóúñ]+)/g, '<sub>$1</sub>'); }

  var LOGO = '<svg class="pf__logo" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="pfGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4df0a8"/><stop offset="1" stop-color="#4ea8ff"/></linearGradient></defs>' +
    '<path d="M8 4c14 6 10 12 24 18M8 18c14 6 10 12 24 18M32 4C18 10 22 16 8 22M32 18C18 24 22 30 8 36" fill="none" stroke="url(#pfGrad)" stroke-width="2.4" stroke-linecap="round"/>' +
    '<path d="M13 8h14M12 13h16M12 27h16M13 32h14" stroke="url(#pfGrad)" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></svg>';

  /** Recurso gráfico de la teoría 3: 2 bits por base frente a 1 bit por símbolo (mismos colores que la actividad 3). */
  function bitsVisual() {
    var B = [['A', '00', '#4df0a8'], ['C', '01', '#5aa9ff'], ['G', '10', '#ffd166'], ['T', '11', '#ff8a7a']];
    return '<div class="pt__bits"><div class="pt__row"><span>ADN</span>' +
      B.map(function (b) { return '<i style="background:' + b[2] + '"><b>' + b[0] + '</b><em>' + b[1] + '</em></i>'; }).join('') +
      '</div><div class="pt__row"><span>Binario</span>' +
      ['0', '1'].map(function (b) { return '<i class="pt__bin"><b>' + b + '</b><em>' + b + '</em></i>'; }).join('') +
      '</div></div>';
  }

  function renderFull(s) {
    var h = '';
    if (s.kind === 'cover') {
      h = '<div class="pf pf--cover"><div class="pcv__top">' + LOGO + '<div class="pcv__title"><h1>' + esc(s.title) + '</h1><p class="pf__sub">' + esc(s.sub) + '</p></div></div>' +
        '<p class="pf__q">' + esc(s.q) + '</p>' +
        '<div class="pc"><span></span><b class="pc__h pc__h--bio"><i class="dot dot--bio"></i>Célula</b><b class="pc__h pc__h--cpu"><i class="dot dot--cpu"></i>Computadora</b>' +
        s.rows.map(function (r) { return '<b class="pc__k">' + esc(r.k) + '</b><span class="pc__c pc__c--bio">' + esc(r.bio) + '</span><span class="pc__c pc__c--cpu">' + esc(r.cpu) + '</span>'; }).join('') +
        '</div><p class="pf__foot">' + esc(s.foot) + '</p></div>';
    } else {
      h = '<div class="pf pf--theory"><div class="pt"><div class="pt__left"><ol class="pt__ideas">' +
        s.ideas.map(function (t, i) { return '<li><b>' + (i + 1) + '</b><span>' + fx(t) + '</span></li>'; }).join('') + '</ol>' +
        (s.visual === 'bits' ? bitsVisual() : '') + '</div>' +
        '<div class="pt__formula">' + s.formulas.map(function (f) {
          return '<div class="pt__fb"><div class="pt__f">' + fx(f.f) + '</div><ul class="pt__vars">' +
            f.vars.map(function (v) { return '<li><b>' + fx(v[0]) + '</b> ' + fx(v[1]) + '</li>'; }).join('') + '</ul></div>';
        }).join('') +
        (s.sim ? '<p class="pt__sim">' + fx(s.sim) + '</p>' : '') +
        (s.chips ? '<p class="pt__chips">' + fx(s.chips) + '</p>' : '') + '</div></div>' +
        '<p class="pt__bridge">' + fx(s.bridge) + '</p></div>';

  }

  /** Reduce cada fórmula protagonista hasta que quepa en una línea (el ancho depende de la pantalla). */
  function fitFormulas() {
    $$('.pt__f', els.full).forEach(function (f) {
      var size = 120; f.style.fontSize = size + 'px';
      while (f.scrollWidth > f.clientWidth && size > 22) { size -= 2; f.style.fontSize = size + 'px'; }
    });
  }

  function clearOff() { $$('.pres-off').forEach(function (e) { e.classList.remove('pres-off'); }); }

  function mainRunning(run) {
    if (!BC.Engine) return;
    if (run && !BC.Engine.isRunning()) BC.Engine.start();
    if (!run && BC.Engine.isRunning()) BC.Engine.pause();
  }

  /** Deja el módulo en su estado por defecto: así cada diapositiva empieza igual al volver a ella. */
  function restoreModule(id, speed) {
    var spec = BC.Modules.defs[id], mod = BC.Modules.get(id);
    if (!spec || !mod) return mod;
    (spec.controls || []).forEach(function (c) {
      var t = c.type || 'range', inp = $('[data-ctl="' + c.id + '"]', mod.el);
      if (!inp || t === 'button') return;
      if (t === 'check') {
        if (inp.checked !== !!c.def) { inp.checked = !!c.def; inp.dispatchEvent(new Event('change')); }
      } else if (t === 'select') {
        if (inp.value !== String(c.def)) { inp.value = c.def; inp.dispatchEvent(new Event('change')); }
      } else if (+inp.value !== +c.def) { inp.value = c.def; inp.dispatchEvent(new Event('input')); }
    });
    mod.speed = speed || spec.defaultSpeed || 1; mod.markSpeed();
    mod.reset();
    mod.setRunning(true);

  }

  function markControls(s, scope, isMain) {
    var keep = (s.keep || []).map(String), pre = (s.presets || []).map(String);
    if (isMain) {
      $$('.slider', scope).forEach(function (w) {
        var inp = $('input', w); w.classList.toggle('pres-off', !inp || keep.indexOf(inp.id) < 0);
      });
    } else {
      $$('[data-ctl]', scope).forEach(function (inp) {
        var w = inp.closest('.slider') || inp.closest('.check') || (inp.tagName === 'BUTTON' ? inp : null);
        if (w) w.classList.toggle('pres-off', keep.indexOf(inp.getAttribute('data-ctl')) < 0);
      });
    }
    $$('[data-preset]', scope).forEach(function (b) { b.classList.toggle('pres-off', pre.indexOf(b.getAttribute('data-preset')) < 0); });
    ['.ctl--bio', '.ctl--cpu'].forEach(function (sel) {
      var col = $(sel, scope); if (!col) return;
      var any = $$('.slider, .check, .mod__btn', col).some(function (w) { return !w.classList.contains('pres-off') && w.style.display !== 'none'; });
      col.classList.toggle('pres-off', !any);
    });
  }

  /** CSS dinámico de la diapositiva: cuántos indicadores y qué ecuaciones se ven (por posición, porque el módulo repinta). */
  function dynCss(s, picks) {
    var sel = 'body[data-present] .mod[data-mod="' + s.mod + '"]';
    var nr = s.reads === undefined ? 4 : s.reads;
    var css = sel + ' [data-reads] .rd:nth-child(n+' + (nr + 1) + '){display:none}';
    if (picks) css += sel + ' [data-eqs] .eq{display:none}' + picks.map(function (n) { return sel + ' [data-eqs] .eq:nth-child(' + n + '){display:block}'; }).join('');
    return css;
  }

  function setDyn(s) {
    lastEqKey = '';
    els.dyn.textContent = (s && s.kind === 'mod') ? dynCss(s) : '';
  }

  /** Muestra solo la(s) ecuación(es) pedida(s). Se reevalúa porque el módulo repinta sus ecuaciones. */
  function eqTick() {
    if (!on) return;
    var s = SL[idx]; if (s.kind !== 'mod') return;
    var scope = $('.mod[data-mod="' + s.mod + '"]'); if (!scope) return;
    var items = $$('[data-eqs] .eq', scope); if (!items.length) return;
    var titles = items.map(function (e) { return norm((e.querySelector('.eq__top') || {}).textContent || ''); });
    var picks = [];
    [].concat(s.eq || []).forEach(function (w) {
      var k = titles.findIndex(function (t) { return t.indexOf(norm(w)) >= 0; });
      if (k >= 0 && picks.indexOf(k + 1) < 0) picks.push(k + 1);
    });
    if (!picks.length) picks = [1];
    var key = s.id + ':' + picks.join(',');
    if (key === lastEqKey) return;
    lastEqKey = key;
    els.dyn.textContent = dynCss(s, picks);
  }

  function go(i) {
    if (!on) return;
    i = Math.max(0, Math.min(SL.length - 1, i));
    var s = SL[i];
    idx = i;
    clearOff();
    doc.body.setAttribute('data-slide', s.kind);
    doc.body.setAttribute('data-slide-id', s.id);

    $('.ph__n', els.head).textContent = s.n || '';
    $('.ph__t', els.head).textContent = s.title;
    $('.ph__q', els.head).textContent = s.kind === 'cover' ? '' : (s.q || '');
    $('.pi__t', els.idea).textContent = s.idea || '';
    $('.pi__src', els.idea).textContent = s.src || '';
    if (!els.refs.hidden) renderRefs();
    els.notes.innerHTML = '<h3>Notas del orador · ' + (i + 1) + '/' + SL.length + '</h3><ul>' + (s.notes || []).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
    $('[data-pres-count]', els.bar).textContent = (i + 1) + ' / ' + SL.length;
    $$('.pb__dot', els.bar).forEach(function (d, k) { d.classList.toggle('is-on', k === i); d.classList.toggle('is-seen', k < i); });

    if (isFull(s)) {
      renderFull(s);
      BC.Modules.open('main');
      mainRunning(false);
      setDyn(null);
    } else if (s.mod === 'main') {
      BC.Modules.open('main');
      mainRunning(true);
      var rb = $('#btnReset'); if (rb) rb.click();
      var sp = $('.app > .controls [data-speed="1"]'); if (sp) sp.click();
      var pb = $('.app > .controls [data-preset="' + s.preset + '"]'); if (pb) pb.click();
      if (root.BioCodeApp && root.BioCodeApp.settle) root.BioCodeApp.settle();
      markControls(s, $('.app > .controls'), true);
      setDyn(null);
    } else {
      BC.Modules.open(s.mod);
      var scope = $('.mod[data-mod="' + s.mod + '"]');
      if (s.kind === 'mod') {
        var mod = restoreModule(s.mod, s.speed);
        if (s.preset !== undefined && mod) { var b = $('[data-preset="' + s.preset + '"]', mod.el); if (b) b.click(); if (BC.Modules.defs[s.mod].restartAfterPreset) mod.reset(); }
        markControls(s, scope, false);
        scope.classList.toggle('pres-nochart', !!s.nochart);
        setDyn(s);
      } else {
        var pspec = BC.Modules.defs[s.mod];
        if (pspec && pspec.enter) pspec.enter();
        setDyn(null);
      }
    }
    var sc = doc.scrollingElement || doc.documentElement; sc.scrollTop = 0;
    root.dispatchEvent(new Event('resize'));
    setTimeout(function () { root.dispatchEvent(new Event('resize')); eqTick(); }, 120);
  }

  // --------------------------------------------------------------- vistas
  function toggleNotes(force) {
    notesOn = force === undefined ? !notesOn : !!force;
    els.notes.hidden = !notesOn;
    $('[data-pres="notes"]', els.bar).classList.toggle('is-active', notesOn);
  }
  function toggleIndex(force) {
    var open = force === undefined ? els.index.hidden : !!force;
    els.index.hidden = !open;
    if (open) { var c = $('.px__card[data-i="' + idx + '"]', els.index); if (c) c.focus(); }
  }
  /** Panel «Referencias»: fuentes de la diapositiva actual o de todas (BC.Refs, verificadas contra el libro). */
  function renderRefs() {
    var R = BC.Refs, s = SL[idx], items = refsAll ? R.ITEMS : R.forSlide(s.id);
    var h = '<div class="px__box"><div class="px__top"><h2>Referencias</h2><div class="rf__tabs">' +
      '<button class="btn' + (refsAll ? '' : ' is-active') + '" type="button" data-refs-view="slide">Esta diapositiva</button>' +
      '<button class="btn' + (refsAll ? ' is-active' : '') + '" type="button" data-refs-view="all">Todas (' + R.ITEMS.length + ')</button></div>' +
      '<button class="btn" type="button" data-pres="closerefs">Cerrar (Esc)</button></div>' +
      '<p class="rf__ctx">' + (refsAll ? 'Todas las fuentes de la presentación' : (s.n ? s.n + ' · ' : '') + esc(s.title)) +
      ' · Páginas = impresas en el libro de Avery (PDF = impresa + 15)</p>' +
      '<div class="rf__list">' + items.map(function (it) {
        var k = R.KINDS[it.kind];
        return '<article class="rf rf--' + it.kind + '"><span class="rf__tag" title="' + esc(k.label) + '">' + k.tag + '</span><div class="rf__body">' +
          '<h3>' + esc(k.label) + ' · <b>' + fx(it.loc) + '</b></h3><p>' + fx(it.txt) + '</p>' +
          '<small>Usado en: ' + it.slides.map(function (id) { return '<i>' + esc(R.label(id)) + '</i>'; }).join('') + '</small></div></article>';
      }).join('') + '</div>' +
      (refsAll ? '<h3 class="rf__bibh">Bibliografía</h3><ul class="rf__bib">' + R.BIB.map(function (b) { return '<li' + (b.main ? ' class="is-main"' : '') + '>' + b.t + '</li>'; }).join('') + '</ul>' : '') +
      '<p class="rf__key"><b>A</b> Avery (2003) · <b>C</b> citado por Avery · <b>E</b> clase / física general · <b>P</b> supuesto del proyecto</p></div>';
    els.refs.innerHTML = h;
    els.refs.scrollTop = 0;
  }
  function toggleRefs(force) {
    var open = force === undefined ? els.refs.hidden : !!force;
    if (open) { toggleIndex(false); toggleNotes(false); refsAll = false; renderRefs(); }
    els.refs.hidden = !open;
    $('[data-pres="refs"]', els.bar).classList.toggle('is-active', open);
    if (open) { var c = $('[data-pres="closerefs"]', els.refs); if (c) c.focus(); }
  }
  function toggleFull() {
    var d = doc.documentElement;
    try {
      if (doc.fullscreenElement) { doc.exitFullscreen(); }
      else if (d.requestFullscreen) { var p = d.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
    } catch (err) { /* el navegador puede negar la pantalla completa */ }
  }

  function onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey || !on) return;
    if (!els.refs.hidden) {
      if (e.key === 'Escape' || e.key === 'b' || e.key === 'B') { e.preventDefault(); e.stopPropagation(); toggleRefs(false); }
      return;
    }
    if (!els.index.hidden) {
      if (e.key === 'Escape' || e.key === 'i' || e.key === 'I') { e.preventDefault(); e.stopPropagation(); toggleIndex(false); }
      return;
    }
    var t = e.target, tag = (t && t.tagName) || '';
    var typing = tag === 'TEXTAREA' || tag === 'SELECT' || (tag === 'INPUT' && t.type !== 'checkbox' && t.type !== 'button');
    var k = e.key;
    if (k === 'PageDown' || (!typing && (k === 'ArrowRight' || k === 'ArrowDown'))) { e.preventDefault(); go(idx + 1); }
    else if (k === 'PageUp' || (!typing && (k === 'ArrowLeft' || k === 'ArrowUp'))) { e.preventDefault(); go(idx - 1); }
    else if (!typing && k === 'Home') { e.preventDefault(); go(0); }
    else if (!typing && k === 'End') { e.preventDefault(); go(SL.length - 1); }
    else if (!typing && (k === 'n' || k === 'N')) { toggleNotes(); }
    else if (!typing && (k === 'i' || k === 'I')) { toggleIndex(true); }
    else if (!typing && (k === 'b' || k === 'B')) { toggleRefs(true); }
    else if (!typing && (k === 'f' || k === 'F')) { toggleFull(); }
  }

  // ------------------------------------------------------------- ciclo
  function start(at, wantFull) {
    if (on) { go(at || 0); return; }
    build();
    on = true;
    doc.body.setAttribute('data-present', '1');
    if (wantFull) toggleFull();
    go(at || 0);
    timer = root.setInterval(eqTick, 250);
  }

  function init() {
    doc.addEventListener('keydown', onKey, true);
    root.addEventListener('resize', function () { if (on && isFull(SL[idx])) fitFormulas(); });
  }

  BC.Present = {
    start: start, go: go, init: init,
    isOn: function () { return on; },
    index: function () { return idx; },
    count: function () { return SL.length; }
  };
  init();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/**
 * BIOCODE · app.js — composición de la aplicación (actividad 2: simulador térmico)
 * ---------------------------------------------------------------------------
 * Une las tres capas:
 *   modelos  (js/models)  → física; no conocen el DOM
 *   vistas   (js/views)   → dibujo; leen model.outputs(), no calculan física
 *   núcleo   (js/core)    → motor de paso fijo, utilidades
 * Este archivo solo cablea controles ↔ entradas de los modelos ↔ vistas, y arranca la
 * secuencia de diapositivas. La actividad 1, la actividad 3 y la calculadora se
 * registran en js/modules.
 */
(function () {
  'use strict';
  var BC = window.BioCode, U = BC.Util, T = BC.Thermo, Bus = BC.Bus, Engine = BC.Engine;
  function $(id) { return document.getElementById(id); }

  // ------------------------------------------------------------------ modelos
  var cell = BC.CellModel.create();
  var cpu = BC.CpuModel.create();
  Engine.register(cell);
  Engine.register(cpu);

  // ------------------------------------------------------------------- vistas
  var cellView = new BC.CellView($('cellCanvas'), cell);
  var cpuView = new BC.CpuView($('cpuCanvas'), cpu);
  var center = new BC.CenterPanel($('indicators'));

  // ---------------------------------------------------------------- controles
  var SLIDERS = {
    cellTemp:     { def: 37,  fmt: function (v) { return U.num(v, 1) + ' °C'; }, apply: function (v) { cell.inputs.Tenv = T.cToK(v); } },
    cellActivity: { def: 15,  fmt: function (v) { return Math.round(v) + ' %'; }, apply: function (v) { cell.inputs.activity = v / 100; } },
    cpuTemp:      { def: 25,  fmt: function (v) { return U.num(v, 1) + ' °C'; }, apply: function (v) { cpu.inputs.Tamb = T.cToK(v); } },
    cpuLoad:      { def: 5,   fmt: function (v) { return Math.round(v) + ' %'; }, apply: function (v) { cpu.inputs.load = v / 100; } }
  };
  // Pares vinculables: 'delta' conserva la diferencia, 'same' copia el valor
  var PAIRS = { cellTemp: ['cpuTemp', 'delta'], cpuTemp: ['cellTemp', 'delta'],
                cellActivity: ['cpuLoad', 'same'], cpuLoad: ['cellActivity', 'same'] };
  var last = {};

  function setSlider(id, v) {
    var el = $(id), s = SLIDERS[id];
    v = U.clamp(+v, +el.min, +el.max);
    el.value = v;
    last[id] = v;
    s.apply(v);
    $(id + 'Out').textContent = s.fmt(v);
  }

  Object.keys(SLIDERS).forEach(function (id) {
    setSlider(id, SLIDERS[id].def);
    $(id).addEventListener('input', function () {
      var v = +this.value, prev = last[id];
      setSlider(id, v);
      var pair = PAIRS[id];
      if ($('linkToggle').checked && pair) {
        var other = pair[0];
        setSlider(other, pair[1] === 'same' ? v : last[other] + (v - prev));
      }
    });
  });

  var PRESETS = {
    rest:   { cellTemp: 37, cellActivity: 15,  cpuTemp: 25, cpuLoad: 5 },
    effort: { cellTemp: 37, cellActivity: 100, cpuTemp: 25, cpuLoad: 100 },
    heat:   { cellTemp: 46, cellActivity: 60,  cpuTemp: 40, cpuLoad: 100 }
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
    b.addEventListener('click', function () {
      var p = PRESETS[b.getAttribute('data-preset')];
      Object.keys(p).forEach(function (id) { setSlider(id, p[id]); });
    });
  });

  // Iniciar / pausar / reiniciar / velocidad
  var btnPlay = $('btnPlay');
  btnPlay.addEventListener('click', function () { Engine.toggle(); });
  Bus.on('state', function (s) { btnPlay.textContent = s.running ? 'Pausar' : 'Iniciar'; });

  /** Lleva ambos modelos a su régimen estacionario (≈10 min simulados): así el simulador no arranca "en frío". */
  function warmStart() {
    for (var i = 0; i < 30000; i++) { cell.step(0.02); cpu.step(0.02); }
  }

  function resetAll() {
    Object.keys(SLIDERS).forEach(function (id) { setSlider(id, SLIDERS[id].def); });
    Engine.reset();
    warmStart();
    refreshUI();
  }
  $('btnReset').addEventListener('click', resetAll);

  var speedBtns = document.querySelectorAll('[data-speed]');
  Array.prototype.forEach.call(speedBtns, function (b) {
    b.addEventListener('click', function () {
      Engine.setSpeed(+b.getAttribute('data-speed'));
      Array.prototype.forEach.call(speedBtns, function (x) { x.classList.toggle('is-active', x === b); });
    });
  });

  document.addEventListener('keydown', function (e) {
    if (BC.Modules && BC.Modules.current() !== 'main') return;       // las teclas las atiende el módulo abierto
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'BUTTON' || tag === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); Engine.toggle(); }
    else if (e.key === 'r' || e.key === 'R') resetAll();
  });

  // ------------------------------------------------------------- tamaño/draw
  function resizeAll() { cellView.resize(); cpuView.resize(); }
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(resizeAll);
    Array.prototype.forEach.call(document.querySelectorAll('.viewport'), function (el) { ro.observe(el); });
  }
  window.addEventListener('resize', resizeAll);

  // ---------------------------------------------------------- bucle de vista
  var cellStatus = $('cellStatus'), cpuStatus = $('cpuStatus');
  var uiAcc = 1;

  function setStatus(el, st) { el.textContent = st.label; el.className = 'status status--' + st.level; }

  function refreshUI() {
    var c = cell.outputs(), p = cpu.outputs();
    center.update(c, p);
    setStatus(cellStatus, c.status);
    setStatus(cpuStatus, p.status);
  }

  Bus.on('frame', function (e) {
    if (BC.Modules && BC.Modules.current() !== 'main') return;       // vista principal oculta
    cellView.update(e.dtView); cellView.draw();
    cpuView.update(e.dtView); cpuView.draw();
    uiAcc += e.real;
    if (uiAcc >= 0.1) { uiAcc = 0; refreshUI(); }
  });

  Bus.on('reset', function () {
    cellView.reset(); cpuView.reset();
    refreshUI();
  });

  // --------------------------------------------------------------- arranque
  cell.reset(); cpu.reset();           // equilibrio térmico inicial con los controles
  warmStart();                         // y régimen estacionario de partida
  resizeAll();
  refreshUI();
  Engine.start();

  BC.Modules.init();
  BC.Present.start(0, false);          // la aplicación arranca directamente en la diapositiva 1

  // Acceso para depuración y pruebas en navegador
  window.BioCodeApp = { cell: cell, cpu: cpu, setSlider: setSlider, resetAll: resetAll,
                        settle: function () { warmStart(); refreshUI(); } };
})();

</script>
</body>
</html>
